<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IVU Avanzada - Puerto Rico</title>
    <style>
        :root {
            --primary-color: #00457C;
            --secondary-color: #0070BA;
            --background-color: #f4f7f9;
            --card-background: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-background);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .results-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
        }

        .results-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .result-row.total {
            font-weight: bold;
            font-size: 18px;
            color: #000;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .info-text {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora de IVU Avanzada</h1>
    
    <div class="form-group">
        <label for="amount">Monto Base ($)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" oninput="calculateIVU()">
    </div>

    <div class="form-group">
        <label for="taxType">Tipo de Transacción / Tasa</label>
        <select id="taxType" onchange="calculateIVU()">
            <option value="general">Tasa General (11.5%)</option>
            <option value="prepared_food">Alimentos Preparados (6.0%)</option>
        </select>
    </div>

    <div class="results-box">
        <p class="results-title">Desglose del Cálculo</p>
        
        <div class="result-row">
            <span>Subtotal (Base):</span>
            <span id="resBase">$0.00</span>
        </div>
        <div class="result-row">
            <span>IVU Estatal (<span id="lblState">10.5</span>%):</span>
            <span id="resState">$0.00</span>
        </div>
        <div class="result-row">
            <span>IVU Municipal (<span id="lblMunicipal">1.0</span>%):</span>
            <span id="resMunicipal">$0.00</span>
        </div>
        <div class="result-row">
            <span>IVU Total Redondeado:</span>
            <span id="resTaxTotal">$0.00</span>
        </div>
        <div class="result-row total">
            <span>Total a Pagar:</span>
            <span id="resGrandTotal">$0.00</span>
        </div>
    </div>

    <p class="info-text">Conforme a la normativa vigente del Departamento de Hacienda de Puerto Rico.</p>
</div>

<script>
    function calculateIVU() {
        const amountInput = document.getElementById('amount').value;
        const taxType = document.getElementById('taxType').value;
        
        const baseAmount = parseFloat(amountInput) || 0;
        
        let stateRate = 0.105;     // 10.5% por defecto
        let municipalRate = 0.01;   // 1% por defecto

        if (taxType === 'prepared_food') {
            stateRate = 0.06;       // 6% reducido para alimentos preparados
            municipalRate = 0.00;   // El 1% municipal no aplica en la exención base del 6% estatal
        }

        // Cálculos correspondientes
        const stateTax = baseAmount * stateRate;
        const municipalTax = baseAmount * municipalRate;
        const totalTax = stateTax + municipalTax;
        const grandTotal = baseAmount + totalTax;

        // Actualización dinámica de etiquetas de porcentaje
        document.getElementById('lblState').innerText = (stateRate * 100).toFixed(1);
        document.getElementById('lblMunicipal').innerText = (municipalRate * 100).toFixed(1);

        // Renderizado en interfaz formateado a moneda de EE.UU. (USD)
        document.getElementById('resBase').innerText = formatCurrency(baseAmount);
        document.getElementById('resState').innerText = formatCurrency(stateTax);
        document.getElementById('resMunicipal').innerText = formatCurrency(municipalTax);
        document.getElementById('resTaxTotal').innerText = formatCurrency(totalTax);
        document.getElementById('resGrandTotal').innerText = formatCurrency(grandTotal);
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD'
        }).format(value);
    }
</script>

</body>
</html>
