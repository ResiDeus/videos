<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Y2K_Boricua_Phone.exe</title>
  <style>
    :root { --phone-case: #3a4d5c; --screen-bg: #8ba88f; --pixel-dark: #223026; --btn-retro: #4e5e6c; }
    * { box-sizing: border-box; font-family: 'Courier New', monospace; font-size: 13px; margin: 0; padding: 0; user-select: none; font-weight: bold; color: var(--pixel-dark); }
    body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    
    .phone-body { width: 100%; max-width: 360px; height: 640px; background: var(--phone-case); border: 4px solid #1f2b35; border-radius: 30px; padding: 15px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border-bottom: 12px solid #1f2b35; }
    .earpiece { width: 60px; height: 6px; background: #1f2b35; border-radius: 3px; margin: 0 auto 10px; }
    .lcd-screen { flex-grow: 1; background: var(--screen-bg); border: 4px inset; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: inset 2px 2px 10px rgba(0,0,0,0.3); }
    .screen-header { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px dashed var(--pixel-dark); padding-bottom: 4px; margin-bottom: 6px; }
    .screen-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
    
    .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-top: 10px; }
    .app-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.05); border: 1px solid var(--pixel-dark); padding: 8px 4px; border-radius: 4px; cursor: pointer; text-align: center; font-size: 11px; }
    .app-icon span { font-size: 20px; margin-bottom: 2px; }
    .app-icon:active { background: rgba(0,0,0,0.15); }
    
    .app-view { display: none; flex-direction: column; height: 100%; gap: 6px; }
    .btn-back { display: inline-block; width: fit-content; border: 1px solid var(--pixel-dark); padding: 2px 8px; margin-bottom: 6px; font-size: 11px; cursor: pointer; background: rgba(0,0,0,0.05); }
    .sunken { border: 1px solid var(--pixel-dark); padding: 6px; background: rgba(255,255,255,0.15); font-size: 12px; margin-top: 4px; word-break: break-word; }
    .field { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    input, select { background: transparent; border: 1px solid var(--pixel-dark); padding: 4px; width: 55%; font-size: 12px; font-family: monospace; outline: none; }
    
    .track { padding: 4px; cursor: pointer; border-bottom: 1px dashed var(--pixel-dark); font-size: 11px; }
    .track.active { background: var(--pixel-dark); color: var(--screen-bg); }
    
    .phone-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; padding: 0 10px; }
    .key { background: var(--btn-retro); color: #fff; text-align: center; padding: 12px 0; border-radius: 12px; font-weight: bold; cursor: pointer; border-bottom: 3px solid #323d4a; box-shadow: 1px 2px 5px rgba(0,0,0,0.3); font-size: 15px; text-shadow: 1px 1px #000; }
    .key:active { border-bottom: 1px solid #323d4a; transform: translateY(2px); box-shadow: none; }
  </style>
</head>
<body>
  <div class="phone-body">
    <div class="earpiece"></div>
    <div class="lcd-screen">
      <div class="screen-header">
        <span>📶 PR_CEL</span>
        <span id="clock">00:00</span>
        <span>🔋85%</span>
      </div>
      <div class="screen-content">
        <div id="main-menu" class="app-grid">
          <div class="app-icon" onclick="showApp('app-ivu')"><span>🧮</span>IVU</div>
          <div class="app-icon" onclick="showApp('app-music')"><span>📻</span>Winamp</div>
          <div class="app-icon" onclick="showApp('app-boricua')"><span>🇵🇷</span>Jerga</div>
          <div class="app-icon" onclick="showApp('app-abuela')"><span>📖</span>Recetas</div>
          <div class="app-icon" onclick="showApp('app-cucaracha')"><span>🪳</span>Radar</div>
        </div>
        <!-- APP: CALCULADORA IVU -->
        <div id="app-ivu" class="app-view">
          <div class="btn-back" onclick="goHome()">[Atrás]</div>
          <div class="field"><label>Precio $:</label><input type="number" id="amount" value="100" oninput="calcIVU()"></div>
          <div class="field">
            <label>Tipo:</label>
            <select id="ivu-type" onchange="calcIVU()">
              <option value="11.5">Reg. 11.5%</option>
              <option value="7">Comida 7%</option>
            </select>
          </div>
          <div class="sunken" id="ivu-results"></div>
        </div>

        <!-- APP: REPRODUCTOR WINAMP -->
        <div id="app-music" class="app-view">
          <div class="btn-back" onclick="goHome()">[Atrás]</div>
          <div class="sunken" id="now-playing" style="font-size:11px; text-align:center; height:20px; overflow:hidden;">RADIO OFF</div>
          <img id="visualizer-gif" src="https://archive.org" style="width: 100%; height: 90px; object-fit: contain; background: #000; border: 2px solid; border-color: var(--pixel-dark); opacity: 0.4;">
          <audio id="audio-player" controls style="width: 100%; height: 28px; margin: 4px 0; outline: none;"></audio>
          <div class="sunken track-list" id="playlist" style="max-height: 120px; overflow-y: auto;"></div>
        </div>
        <!-- APP: BORICUÓMETRO -->
        <div id="app-boricua" class="app-view">
          <div class="btn-back" onclick="goHome()">[Atrás]</div>
          <div class="field">
            <label>Palabra:</label>
            <select id="boricua-word" onchange="traducirBoricua()">
              <option value="">-- Elige --</option>
              <option value="gandul">Como el gandul</option>
              <option value="alcapurria">Guayando</option>
              <option value="revolu">Un revolú</option>
              <option value="chinchorreo">Chinchorreo</option>
            </select>
          </div>
          <div class="sunken" id="boricua-result">Elige jerga.</div>
        </div>

        <!-- APP: REMEDIOS ABUELA -->
        <div id="app-abuela" class="app-view">
          <div class="btn-back" onclick="goHome()">[Atrás]</div>
          <div class="field">
            <label>Achaque:</label>
            <select id="remedio-selector" onchange="verRemedio()">
              <option value="">-- Elige --</option>
              <option value="empacho">Empacho</option>
              <option value="resfriado">Tos/Pecho</option>
              <option value="mal_de_ojo">Mal de Ojo</option>
            </select>
          </div>
          <div class="sunken" id="remedio-result" style="font-size: 11px;">Elige un síntoma.</div>
        </div>

        <!-- APP: CUCARACHAS TIMER -->
        <div id="app-cucaracha" class="app-view">
          <div class="btn-back" onclick="goHome()">[Atrás]</div>
          <div class="field"><label>Pueblo:</label><select id="town-selector" onchange="evaluarInvasionCucaracha()"></select></div>
          <div id="town-weather-title" style="font-size:11px; margin-top:2px;">ESTADO: SELECCIONAR</div>
          <div class="sunken" id="timer-display" style="text-align: center; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.1); padding: 4px;">RADAR STANDBY</div>
          <div class="sunken" id="cucaracha-consejo" style="font-size: 11px; max-height: 80px; overflow-y: auto;">Elige pueblo.</div>
        </div>
      </div>
    </div>
    <!-- TECLADO FÍSICO DEL CELULAR -->
    <div class="phone-pad">
      <div class="key" onclick="goHome()">🏠</div>
      <div class="key" onclick="playWin98ErrorSound()">📞</div>
      <div class="key" onclick="goHome()">✖</div>
      <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div>
      <div class="key">7</div><div class="key">8</div><div class="key">9</div>
    </div>
  </div>

  <script>
    // --- NAVEGACIÓN DE PANTALLA COMPLETA MÓVIL ---
    function showApp(appId) {
      document.getElementById('main-menu').style.display = 'none';
      document.querySelectorAll('.app-view').forEach(view => view.style.display = 'none');
      document.getElementById(appId).style.display = 'flex';
    }
    function goHome() {
      document.querySelectorAll('.app-view').forEach(view => view.style.display = 'none');
      document.getElementById('main-menu').style.display = 'grid';
    }
    // --- BASE DE DATOS MÓVIL COMPACTA ---
    const municipiosPR = [
      { n: "Adjuntas", costa: false }, { n: "Aguadilla", costa: true }, { n: "Arecibo", costa: true }, { n: "Barranquitas", costa: false },
      { n: "Bayamón", costa: true }, { n: "Cabo Rojo", costa: true }, { n: "Caguas", costa: false }, { n: "Carolina", costa: true },
      { n: "Cayey", costa: false }, { n: "Cidra", costa: false }, { n: "Fajardo", costa: true }, { n: "Guayama", costa: true },
      { n: "Humacao", costa: true }, { n: "Isabela", costa: true }, { n: "Jayuya", costa: false }, { n: "Mayagüez", costa: true },
      { n: "Orocovis", costa: false }, { n: "Ponce", costa: true }, { n: "Rincón", costa: true }, { n: "San Juan", costa: true },
      { n: "Utuado", costa: false }, { n: "Yauco", costa: true }
    ];

    window.onload = function() {
      const s = document.getElementById('town-selector');
      if (s) s.innerHTML = `<option value="">-- Pueblo --</option>` + municipiosPR.map(m => `<option value="${m.n}">${m.n}</option>`).join('');
    };

    // --- RELOJ ---
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }); }, 1000);
    // --- AUDIO CHORD SYNTH ---
    function playWin98ErrorSound() {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const freqs = [130.81, 164.81, 196.00]; 
        freqs.forEach(freq => {
          const osc = audioContext.createOscillator(); const gain = audioContext.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, audioContext.currentTime);
          gain.gain.setValueAtTime(0.1, audioContext.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
          osc.connect(gain); gain.connect(audioContext.destination); osc.start(); osc.stop(audioContext.currentTime + 0.3);
        });
      } catch (e) {}
    }

    // --- IVU ---
    function calcIVU() {
      const amt = parseFloat(document.getElementById('amount').value) || 0; const type = parseFloat(document.getElementById('ivu-type').value);
      let est = type === 11.5 ? amt * 0.105 : amt * 0.06; let mun = amt * 0.01;
      document.getElementById('ivu-results').innerHTML = `Est: $${est.toFixed(2)} | Mun: $${mun.toFixed(2)}<br><b>IVU: $${(est+mun).toFixed(2)} | Total: $${(amt+est+mun).toFixed(2)}</b>`;
    }
    calcIVU();
    // --- MUSICA DISCO ---
    const canciones = [
      { titulo: "Yankee - Gasolina", url: "https://archive.org" },
      { titulo: "Yankee - Rompe", url: "https://archive.org" }
    ];
    const audio = document.getElementById('audio-player');
    function renderPlaylist() { document.getElementById('playlist').innerHTML = canciones.map((c, i) => `<div class="track" onclick="playTrack(${i})">📻 ${c.titulo}</div>`).join(''); }
    function playTrack(i) { document.getElementById('now-playing').textContent = canciones[i].titulo.toUpperCase(); audio.src = canciones[i].url; audio.crossOrigin = "anonymous"; audio.play(); document.getElementById('visualizer-gif').style.opacity = "1"; }
    audio.addEventListener('pause', () => { document.getElementById('visualizer-gif').style.opacity = "0.4"; });
    renderPlaylist();

    function addTrackPrompt() { const title = prompt("Nombre:"); const url = prompt("MP3 URL:"); if (title && url) { canciones.push({ titulo: title, url: url }); renderPlaylist(); }}

    // --- JERGA ---
    function traducirBoricua() {
      const p = document.getElementById('boricua-word').value; const r = document.getElementById('boricua-result');
      const d = { gandul: "Apretado de tiempo.", alcapurria: "Trabajar muy duro.", revolu: "Caos o desorden total.", chinchorreo: "Ruta gastronómica de frituras." };
      r.innerHTML = p ? `<b>Significado:</b><br>${d[p]}` : "Elige palabra.";
    }

    // --- BOTANICA ---
    function verRemedio() {
      const a = document.getElementById('remedio-selector').value; const d = document.getElementById('remedio-result');
      const l = { empacho: "Aceite de oliva tibio en vientre y té de menta.", resfriado: "Té de jengibre, malojillo, ajo y miel.", mal_de_ojo: "Pulsera de azabache y ruda fresca." };
      d.innerHTML = a ? `📜 <b>Receta Abuela:</b><br>${l[a]}` : "Elige síntoma.";
    }
    // --- RADAR CUCARACHA AUTO-WEATHER AUTOMÁTICO ---
    let c_interval = null;
    function evaluarInvasionCucaracha() {
      const pName = document.getElementById('town-selector').value; const timer = document.getElementById('timer-display'); const consejo = document.getElementById('cucaracha-consejo');
      clearInterval(c_interval); if (!pName) { timer.textContent = "RADAR OFF"; return; }
      
      const pInfo = municipiosPR.find(m => m.n === pName);
      const hora = new Date().getHours();
      let temp = pInfo.costa ? 86 : 75; if (hora >= 12 && hora <= 16) temp += 4;
      
      document.getElementById('town-weather-title').innerHTML = `PUEBLO: ${pName.toUpperCase()} | ${temp}°F`;

      if (pInfo.costa && temp >= 85) {
        playWin98ErrorSound(); let t = 42 * 60;
        consejo.innerHTML = `⚠️ <b>HUMERO ACTIVO:</b> El vapor de los drenajes en ${pName} está alto. Cierra ventanas de paleta.`;
        c_interval = setInterval(() => { t--; let m = Math.floor(t / 60); let s = t % 60; timer.textContent = `ALERT: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; if (t <= 0) { clearInterval(c_interval); timer.textContent = "¡INVASIÓN!"; playWin98ErrorSound(); } }, 1000);
      } else { timer.textContent = "SISTEMA: OK"; consejo.innerHTML = `Clima estable en ${pName}. Tuberías secas. Riesgo de plaga voladora: BAJO.`; }
    }
  </script>
</body>
</html>
