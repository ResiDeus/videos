<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de ResiDeus</title>

    <!-- 📱 CONFIGURACIÓN DE PANTALLA DE INICIO IPHONE / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ResiDeus">
    
    <link rel="icon" type="image/jpeg" href="./icon.jpg?v=200">
    <link rel="apple-touch-icon" type="image/jpeg" href="./icon.jpg?v=200">

    <style>
        /* ==========================================================================
           🎨 VARIABLES DE TEMA ADAPTATIVAS PARA ABSOLUTAMENTE TODO EL UI
           ========================================================================== */
        body.theme-cyberpunk {
            --bg-grad: linear-gradient(180deg, #09011a 0%, #2c044d 100%);
            --neon-primary: #ff007f; --neon-secondary: #00f0ff; --btn-bg: #1f0b35; --btn-text: #ff007f;
            --num-bg: linear-gradient(180deg, #2d0e54 0%, #11021f 100%);
            --receipt-glow: #00ff66;
            --blue-tech: linear-gradient(45deg, #0044cc, #00f0ff, #0044cc);
        }
        body.theme-retro-gold {
            --bg-grad: linear-gradient(180deg, #1c1917 0%, #44403c 100%);
            --neon-primary: #d97706; --neon-secondary: #fbbf24; --btn-bg: #2e2521; --btn-text: #fbbf24;
            --num-bg: linear-gradient(180deg, #44403c 0%, #1c1917 100%);
            --receipt-glow: #fbbf24;
            --blue-tech: linear-gradient(45deg, #78350f, #fbbf24, #78350f);
        }
        body.theme-matrix {
            --bg-grad: linear-gradient(180deg, #022c22 0%, #050505 100%);
            --neon-primary: #10b981; --neon-secondary: #34d399; --btn-bg: #073b2e; --btn-text: #34d399;
            --num-bg: linear-gradient(180deg, #022c22 0%, #050505 100%);
            --receipt-glow: #34d399;
            --blue-tech: linear-gradient(45deg, #04583d, #34d399, #04583d);
        }
        body.theme-sunset {
            --bg-grad: linear-gradient(180deg, #451a03 0%, #78350f 100%);
            --neon-primary: #f97316; --neon-secondary: #fdba74; --btn-bg: #3d1505; --btn-text: #fdba74;
            --num-bg: linear-gradient(180deg, #78350f 0%, #292524 100%);
            --receipt-glow: #fdba74;
            --blue-tech: linear-gradient(45deg, #9a3412, #fdba74, #9a3412);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; position: relative; font-family: monospace; transition: background 0.3s ease; }
        body { background: var(--bg-grad) !important; }
        
        /* ✨ AMBIENTACIÓN RETRO */
        .sky { position: absolute; width: 100%; height: 100%; background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1.5px 1px at 75px 120px, #fff9, transparent); background-size: 380px 380px; z-index: 1; animation: twk 4s infinite linear; pointer-events: none; }
        .grid3d { position: absolute; width: 100%; height: 40%; bottom: 0; background-size: 40px 40px; transform: perspective(180px) rotateX(65deg); transform-origin: top center; z-index: 1; animation: gM 2.5s infinite linear; pointer-events: none; }
        .grid3d { background-image: linear-gradient(rgba(255, 0, 127, 0.12) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 0, 127, 0.12) 2px, transparent 2px); }
        @keyframes twk { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes gM { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }
        
        /* 📟 CHASIS FÍSICO CON REGLA ESTRICTA DE ENERGÍA */
        .chasis { width: 340px; height: auto; min-height: 580px; background: #160d21; border: 4px solid var(--neon-primary); box-shadow: 0 0 25px rgba(255, 0, 127, 0.3); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; padding: 12px; gap: 8px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* 🔌 APAGÓN TOTAL ESTRICTO (EXTINGUE PRECIO Y DEJA EL POWER EN VERDE NEÓN) */
        .chasis.global-power-off { filter: grayscale(0.5); box-shadow: none !important; border-color: #333 !important; background: #0b0611; }
        .chasis.global-power-off .lcd { background: #121805 !important; box-shadow: inset 0 4px 10px rgba(0,0,0,0.9) !important; border-color: #222 !important; }
        .chasis.global-power-off .lcd * { opacity: 0 !important; visibility: hidden !important; text-shadow: none !important; }
        
        /* 🚨 PRECIO TOTALMENTE INVISIBLE EN EL APAGADO */
        .chasis.global-power-off .contenedor-precio-unificado { opacity: 0 !important; visibility: hidden !important; box-shadow: none !important; outline: none !important; }
        
        .chasis.global-power-off .btn-key:not(.power-btn), 
        .chasis.global-power-off .caja-data, 
        .chasis.global-power-off .btn-theme, 
        .chasis.global-power-off .btn-receipt,
        .chasis.global-power-off .btn-step,
        .chasis.global-power-off .btn-add-embedded { box-shadow: none !important; text-shadow: none !important; border-color: #222 !important; animation: none !important; opacity: 0 !important; pointer-events: none !important; }
        
        /* 🟢 BOTÓN DE ENCENDIDO VERDE EN APAGADO ACTIVO CONSTANTE */
        .chasis.global-power-off .btn-power-bottom { background: #022c22 !important; border-color: #10b981 !important; color: #34d399 !important; text-shadow: 0 0 8px #10b981 !important; opacity: 1 !important; pointer-events: auto !important; }

        /* 🟢 PANTALLA LCD VERDE RETRO */
        .lcd { width: 100%; height: 175px; background: #92b043; border: 2px solid #000; border-radius: 14px; color: #000; box-shadow: inset 0 4px 10px rgba(0,0,0,0.4); font-weight: bold; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: all 0.4s ease; transform-origin: center; z-index: 12; }
        
        /* Animaciones CRT de Televisor Vintage (Cierre y Apertura Inversa) */
        @keyframes crtTVClose { 0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; } 40% { transform: scale(1, 0.01); filter: brightness(3); opacity: 1; } 100% { transform: scale(0, 0); filter: brightness(5); opacity: 0; background: #fff; } }
        @keyframes crtTVOpen { 0% { transform: scale(0, 0); filter: brightness(5); opacity: 0; background: #fff; } 40% { transform: scale(1, 0.01); filter: brightness(3); opacity: 1; } 100% { transform: scale(1, 1); filter: brightness(1); opacity: 1; } }
        .lcd.power-off-crt { animation: crtTVClose 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important; }
        .lcd.power-on-crt { animation: crtTVOpen 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important; }

        .lcd-header { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid rgba(0,0,0,0.2); }
        .blinking-header-text { opacity: 1; }

        .lcd-wrapper { position: relative; flex-grow: 1; display: flex; flex-direction: column; margin: 4px 0; max-height: 55px; }
        .lcd-historial { flex-grow: 1; font-size: 10px; overflow-y: auto; text-align: left; padding-right: 4px; line-height: 1.3; }
        .lcd-body { text-align: left !important; font-size: 10px; line-height: 1.2; }
        .lcd-total { font-size: 24px; font-weight: 900; text-align: left !important; }

        @keyframes blinkScrollHint { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .scroll-hint { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: rgba(0,0,0,0.8); animation: blinkScrollHint 1s infinite ease-in-out; pointer-events: none; display: none; background: rgba(146, 176, 67, 0.9); padding: 0 4px; border-radius: 3px; font-weight: 900; }
        /* 🎛️ CORRECCIÓN DE LA FILA UNIFICADA: 4 Columnas perfectas alineadas horizontalmente */
        .row-opciones-pasos { display: grid; grid-template-columns: repeat(4, 1fr) !important; gap: 4px; width: 100%; }
        .wrapper-pasos { display: flex; flex-direction: column; gap: 2px; align-items: center; width: 100%; }
        
        /* 🕹️ Flechas más grandes, adaptadas dinámicamente al color de cada tema */
        .btn-step { width: 100%; height: 22px; background: #22123b; border: 1px solid var(--neon-primary); color: #fff; font-size: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; border-radius: 4px; transition: all 0.1s ease; user-select: none; -webkit-user-select: none; }
        .btn-step:active { transform: scale(0.92); background: #fff !important; color: #000 !important; box-shadow: 0 0 10px #fff; }

        /* Botones de Opciones con Fondo Sólido Animado Continuo Synthwave */
        @keyframes activeMenuMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes neonPulse {
            0%, 100% { box-shadow: 0 0 8px var(--neon-primary), inset 0 0 3px var(--neon-primary); border-color: #fff; }
            50% { box-shadow: 0 0 16px var(--neon-secondary), inset 0 0 6px var(--neon-secondary); border-color: var(--neon-secondary); }
        }
        .caja-data { width: 100%; padding: 4px 2px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 9px; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 48px; position: relative; background: linear-gradient(135deg, #150624 0%, #250b3e 50%, #150624 100%); background-size: 200% 200%; animation: activeMenuMove 6s infinite ease-in-out; border: 2px solid var(--neon-primary); color: #fff !important; opacity: 0.9; overflow: hidden; }
        .caja-data.btn-on { animation: neonPulse 1.8s infinite ease-in-out, activeMenuMove 3s infinite ease-in-out; background: linear-gradient(45deg, #2a0845, #6441a5, #2a0845); background-size: 200% 200%; color: #fff !important; opacity: 1 !important; border-color: #fff; }

        /* 📟 CONTENEDOR INTEGRADO DE PRECIO (CENTRADO + BOTÓN + MÁS GRANDE A LA DERECHA) */
        .contenedor-precio-unificado { display: flex; width: 100%; gap: 4px; background: linear-gradient(-45deg, #051a24, #082f44, #03121a, #0c3e54); background-size: 300% 300%; animation: activeMenuMove 6s infinite ease-in-out; border-radius: 10px; border: 2px solid var(--neon-secondary); padding: 4px; min-height: 52px; align-items: center; transition: opacity 0.2s ease, visibility 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; position: relative; }
        .contenedor-precio-unificado.precio-on { border-color: #fff; box-shadow: 0 0 12px var(--neon-secondary); }
        
        /* 🔵 BOTÓN + MÁS GRANDE AZUL TECNOLÓGICO SYNTHWAVE ANIMADO A MANO DERECHA */
        .btn-add-embedded { width: 55px; height: 100%; min-height: 40px; background: var(--blue-tech); background-size: 200% 200%; animation: activeMenuMove 4s infinite ease-in-out; border: 1px solid var(--neon-secondary); border-radius: 6px; color: #fff; font-size: 22px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); transition: all 0.1s ease; user-select: none; }
        .btn-add-embedded:active { transform: scale(0.92); filter: brightness(1.4); }
        
        /* Centrado absoluto del texto del input de Precio */
        #cajaSub { flex-grow: 1; background: transparent !important; border: none !important; box-shadow: none !important; min-height: auto; align-items: center !important; justify-content: center !important; color: #fff !important; opacity: 1; text-align: center; }
        #cajaSub .lbl-title { font-size: 8px; text-transform: uppercase; color: var(--neon-secondary); margin-bottom: 1px; font-weight: bold; text-shadow: 0 0 4px rgba(0,240,255,0.2); }
        #cajaSub .lbl-val { font-size: 18px !important; font-weight: 900; color: #fff !important; }

        /* ⌨️ TECLADO NUMÉRICO UNIFICADO Y RECIBO */
        .pad-num { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; }
        .btn-key { height: 38px; background: var(--num-bg); border: 1px solid var(--neon-primary); border-radius: 6px; color: #fff; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; font-family: monospace; transition: all 0.2s ease; }
        .btn-key:active { filter: brightness(1.4); border-color: var(--neon-secondary); }
        .btn-back { color: #fff !important; background: var(--num-bg) !important; border-color: var(--neon-primary) !important; }

        .btn-theme, .btn-receipt, .btn-power-bottom { border-radius: 10px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; display: flex; justify-content: center; align-items: center; font-family: monospace; height: 28px; font-size: 8px; background: linear-gradient(180deg, #2b2930 0%, #1c1a1f 100%) !important; border: 2px solid var(--neon-primary) !important; color: #ccc !important; width: 100%; z-index: 15; }
        .btn-theme:active, .btn-receipt:active, .btn-power-bottom:active { border-color: var(--neon-secondary) !important; color: #fff !important; }

        .row-acciones-inferior { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 2px; width: 100%; }
        .holograma-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 2, 24, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .holograma-overlay.activo { opacity: 1; pointer-events: auto; visibility: visible; }

        .holograma-ticket { width: 320px; max-height: 80vh; background: rgba(15, 10, 25, 0.95); border: 2px solid var(--receipt-glow); box-shadow: 0 0 30px var(--receipt-glow), inset 0 0 15px rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; transform: scale(0.85); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); color: #fff; font-family: monospace; }
        .holograma-overlay.activo .holograma-ticket { transform: scale(1); }
        .holograma-lineas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; pointer-events: none; z-index: 5; }
        .holograma-scrollable { flex-grow: 1; overflow-y: auto; font-size: 11px; line-height: 1.4; white-space: pre-wrap; padding-right: 4px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 8px; background: rgba(0, 0, 0, 0.5); color: var(--receipt-glow); text-shadow: 0 0 3px var(--receipt-glow); }
        .holograma-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-holo { padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; border: 1px solid var(--receipt-glow); font-family: monospace; font-size: 11px; text-align: center; background: transparent; color: var(--receipt-glow); transition: all 0.2s ease; }
        
        @keyframes deTresPuntos { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } 100% { content: "."; } }
        .lcd-tipeo::after { content: "."; animation: deTresPuntos 1.2s infinite steps(1, start) !important; }
    </style>
</head>
<body class="theme-cyberpunk">
    <div class="sky"></div>
    <div class="grid3d"></div>

    <div class="chasis" id="calcChasis">
        <!-- 🟢 PANTALLA LCD VERDE RETRO -->
        <div class="lcd" id="pantallaVerde">
            <div class="lcd-header">
                <span id="txtHeaderIndicadores" class="blinking-header-text">SISTEMA ACTIVO</span>
            </div>
            <div class="lcd-wrapper">
                <div class="listaPrecios-container" style="flex-grow: 1; position: relative; display: flex; flex-direction: column; overflow: hidden;">
                    <div class="lcd-historial" id="listaPrecios">
                        <span id="lblArtText">Lista vacía<span class="lcd-tipeo"></span></span>
                    </div>
                    <div class="scroll-hint" id="flechaGuia">▼ deslizar</div>
                </div>
            </div>
            <div class="lcd-body">
                <div id="rowDesc" style="opacity: 0.3; transition: opacity 0.15s ease;">DESCUENTO: <span id="outDesc">-$0.00</span></div>
                <div id="rowTip" style="opacity: 0.2; transition: opacity 0.15s ease;">PROPINA: <span id="outTip">$0.00</span></div>
                <div id="rowIvu" style="opacity: 0.3; transition: opacity 0.15s ease;">IVU: <span id="outIvu">$0.00</span></div>
                <div class="lcd-total" style="margin-bottom: 1px;">TOTAL: $<span id="outPer">0.00</span></div>
                <div id="rowPersonaCuota" style="opacity: 0.3; font-size: 11px; margin-top: 1px; transition: opacity 0.15s ease;"><span id="txtSerruchoLabelType">SERRUCHO (C/U): N/A</span> <span id="outPerPersonaLine"></span></div>
            </div>
        </div>

        <!-- 🎛️ CONTENEDOR UNIFICADO DE PRECIO CENTRADO + ADICIÓN GRANDE A LA DERECHA -->
        <div class="contenedor-precio-unificado precio-on" id="marcadorPrecioUnificado">
            <div style="width:55px; opacity:0; pointer-events:none;"></div> <!-- Contrapeso exacto para centrar el Precio en el medio -->
            <div id="cajaSub" class="caja-data" onclick="seleccionarMenu('sub')">
                <span class="lbl-title">Precio</span>
                <span class="lbl-val">$<span id="lblSub" class="blink-num">0</span></span>
            </div>
            <button id="btnAnadirGlobal" class="btn-add-embedded" onclick="addProducto()">+</button>
        </div>

        <!-- Fila unificada amarrada en Grid de 4 columnas horizontales estrictas -->
        <div class="row-opciones-pasos">
            <!-- Columna Serrucho -->
            <div class="wrapper-pasos">
                <button class="btn-step" onmousedown="iniciarAutoIncremento('ppl', 1)" ontouchstart="iniciarAutoIncrementoTouch(event, 'ppl', 1)" onmouseup="detenerAutoIncremento()" onmouseleave="detenerAutoIncremento()" ontouchend="detenerAutoIncremento()">▲</button>
                <div id="cajaPpl" class="caja-data btn-off" onclick="seleccionarMenu('ppl')">
                    <span class="lbl-title">Serrucho</span>
                    <span class="lbl-val"><span id="lblPpl">N/A</span></span>
                </div>
                <button class="btn-step" onmousedown="iniciarAutoIncremento('ppl', -1)" ontouchstart="iniciarAutoIncrementoTouch(event, 'ppl', -1)" onmouseup="detenerAutoIncremento()" onmouseleave="detenerAutoIncremento()" ontouchend="detenerAutoIncremento()">▼</button>
            </div>

            <!-- Columna Descuento -->
            <div class="wrapper-pasos">
                <button class="btn-step" onmousedown="iniciarAutoIncremento('desc', 1)" ontouchstart="iniciarAutoIncrementoTouch(event, 'desc', 1)" onmouseup="detenerAutoIncremento()" onmouseleave="detenerAutoIncremento()" ontouchend="detenerAutoIncremento()">▲</button>
                <div id="cajaDesc" class="caja-data btn-off" onclick="seleccionarMenu('desc')">
                    <span class="lbl-title">Descuento</span>
                    <span class="lbl-val">-<span id="lblDesc">0</span>%</span>
                </div>
                <button class="btn-step" onmousedown="iniciarAutoIncremento('desc', -1)" ontouchstart="iniciarAutoIncrementoTouch(event, 'desc', -1)" onmouseup="detenerAutoIncremento()" onmouseleave="detenerAutoIncremento()" ontouchend="detenerAutoIncremento()">▼</button>
            </div>

            <!-- Columna Propina -->
            <div class="wrapper-pasos">
                <button class="btn-step" onmousedown="iniciarAutoIncremento('tip', 1)" ontouchstart="iniciarAutoIncrementoTouch(event, 'tip', 1)" onmouseup="detenerAutoIncremento()" onmouseleave="detenerAutoIncremento()" ontouchend="detenerAutoIncremento()">▲</button>
                <div id="cajaTip" class="caja-data btn-off" onclick="seleccionarMenu('tip')">
                    <span class="lbl-title">Propina</span>
                    <span class="lbl-val"><span id="lblTip">0</span>%</span>
                </div>
                <button class="btn-step" onmousedown="iniciarAutoIncremento('tip', -1)" ontouchstart="iniciarAutoIncrementoTouch(event, 'tip', -1)" onmouseup="detenerAutoIncremento()" onmouseleave="detenerAutoIncremento()" ontouchend="detenerAutoIncremento()">▼</button>
            </div>

            <!-- Columna IVU -->
            <div class="wrapper-pasos">
                <button class="btn-step" onmousedown="iniciarAutoIncremento('ivu', 0.1)" ontouchstart="iniciarAutoIncrementoTouch(event, 'ivu', 0.1)" onmouseup="detenerAutoIncremento()" onmouseleave="detenerAutoIncremento()" ontouchend="detenerAutoIncremento()">▲</button>
                <div id="btnToggleIvu" class="caja-data btn-off" onclick="seleccionarMenu('ivu')">
                    <span class="lbl-title">IVU</span>
                    <span class="lbl-val"><span id="lblIvuBoton">0.0</span>%</span>
                </div>
                <button class="btn-step" onmousedown="iniciarAutoIncremento('ivu', -0.1)" ontouchstart="iniciarAutoIncrementoTouch(event, 'ivu', -0.1)" onmouseup="detenerAutoIncremento()" onmouseleave="detenerAutoIncremento()" ontouchend="detenerAutoIncremento()">▼</button>
            </div>
        </div>

        <!-- ⌨️ TECLADO NUMÉRICO REORDENADO -->
        <div class="pad-num">
            <button id="btnN7" onclick="num('7')" class="btn-key">7</button><button id="btnN8" onclick="num('8')" class="btn-key">8</button><button id="btnN9" onclick="num('9')" class="btn-key">9</button>
            <button id="btnN4" onclick="num('4')" class="btn-key">4</button><button id="btnN5" onclick="num('5')" class="btn-key">5</button><button id="btnN6" onclick="num('6')" class="btn-key">6</button>
            <button id="btnN1" onclick="num('1')" class="btn-key">1</button><button id="btnN2" onclick="num('2')" class="btn-key">2</button><button id="btnN3" onclick="num('3')" class="btn-key">3</button>
            
            <button id="btnPunto" onclick="num('.')" class="btn-key">.</button>
            <button id="btnN0" onclick="num('0')" class="btn-key">0</button>
            <button id="btnBksp" onclick="bksp()" class="btn-key btn-back">←</button>
        </div>

        <!-- Fila inferior de control unificada con la misma UI variable -->
        <div class="row-acciones-inferior">
            <button id="btnTheme" class="btn-theme" onclick="rotarTema()">TEMA</button>
            <button id="btnReceipt" class="btn-receipt" onclick="abrirHologramaRecibo()">RECIBO</button>
            <button id="btnTogglePower" class="btn-power-bottom power-active-btn" onclick="solicitarApagado()">⏻</button>
        </div>
    </div> <!-- Cierre de chasis -->
    <script>
        // 💾 CONTROL DE ESTADOS, MEMORIAS Y ACUMULADORES FISCALES
        let ivu = 0.0, mode = 'sub', sSub = "0", incluirPropina = false, modoSerruchoActivo = false, modoDescuentoActivo = false, modoIvuActivo = false;
        let sDesc = "0", sTip = "15", sPpl = "2", sIvuModificado = "11.5"; 
        let memoriaDescuentoPct = "0", memoriaTipPct = "15", memoriaSerruchoCortes = "2", memoriaIvuPct = "11.5";
        let preciosGuardados = [], cuentaAcumulada = 0, textoReciboGlobal = "";
        let themes = ['theme-cyberpunk', 'theme-retro-gold', 'theme-matrix', 'theme-sunset'], temaActualIdx = 0;
        let sistemaEncendido = true; 

        // Temporizadores calibrados para la ráfaga de presión prolongada
        let intervaloAutoIncremento = null;
        let timeoutAutoIncremento = null;

        // 🟢 SINTETIZADOR DE AUDIO RETRO
        function dispararEfectoGlitch() {
            if (!sistemaEncendido) return;
            const lcd = document.getElementById('pantallaVerde');
            if (lcd) {
                lcd.classList.add('glitch-active');
                setTimeout(() => { lcd.classList.remove('glitch-active'); }, 120);
            }
        }

        function reproducirSonido(tipo) {
            if (!sistemaEncendido && tipo !== 'apagar' && tipo !== 'menu') return;
            dispararEfectoGlitch();
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                
                if (tipo === 'menu') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                } else if (tipo === 'tecla') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(350, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                } else if (tipo === 'paso') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(950, ctx.currentTime);
                    gain.gain.setValueAtTime(0.04, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.04);
                    osc.start(); osc.stop(ctx.currentTime + 0.04);
                    return;
                } else if (tipo === 'add') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(450, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(950, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                } else if (tipo === 'apagar') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                    return;
                }
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        // ⏱️ LÓGICA DE PRESIÓN PROLONGADA SIN DUPLICACIÓN EN IPHONE
        function iniciarAutoIncrementoTouch(e, tipo, delta) {
            if (e && e.cancelable) e.preventDefault(); // 📱 MATA EL REBOTE TÁCTIL EN IOS
            iniciarAutoIncremento(tipo, delta);
        }

        function iniciarAutoIncremento(tipo, delta) {
            if (!sistemaEncendido) return;
            ejecutarModificacionPaso(tipo, delta);
            
            timeoutAutoIncremento = setTimeout(() => {
                intervaloAutoIncremento = setInterval(() => {
                    ejecutarModificacionPaso(tipo, delta);
                }, 110); // Velocidad de comodidad calibrada a 110ms
            }, 350);
        }

        function detenerAutoIncremento() {
            clearTimeout(timeoutAutoIncremento);
            clearInterval(intervaloAutoIncremento);
        }
        function ejecutarModificacionPaso(tipo, delta) {
            if (!sistemaEncendido) return;
            reproducirSonido('paso');
            
            if (tipo === 'ppl') {
                modoSerruchoActivo = true;
                let val = parseInt(memoriaSerruchoCortes) || 2;
                val += delta;
                if (val < 2) { val = 2; modoSerruchoActivo = false; }
                if (val > 99) val = 99;
                memoriaSerruchoCortes = val.toString();
                sPpl = memoriaSerruchoCortes;
                document.getElementById('lblPpl').innerText = modoSerruchoActivo ? sPpl : "N/A";
            } 
            else if (tipo === 'desc') {
                modoDescuentoActivo = true;
                let val = parseFloat(memoriaDescuentoPct) || 0;
                val += delta;
                if (val <= 0) { val = 0; modoDescuentoActivo = false; }
                if (val > 100) val = 100;
                memoriaDescuentoPct = val.toFixed(1).replace('.0', '');
                sDesc = memoriaDescuentoPct;
                document.getElementById('lblDesc').innerText = sDesc;
            } 
            else if (tipo === 'tip') {
                incluirPropina = true;
                let val = parseFloat(memoriaTipPct) || 0;
                val += delta;
                if (val <= 0) { val = 0; incluirPropina = false; }
                if (val > 100) val = 100;
                memoriaTipPct = val.toFixed(1).replace('.0', '');
                sTip = memoriaTipPct;
                document.getElementById('lblTip').innerText = sTip;
            } 
            else if (tipo === 'ivu') {
                if (!modoIvuActivo && delta > 0) {
                    modoIvuActivo = true;
                    memoriaIvuPct = "11.5";
                } else {
                    let val = parseFloat(memoriaIvuPct) || 0;
                    val += delta;
                    if (val <= 0) { val = 0; modoIvuActivo = false; }
                    if (val > 100) val = 100;
                    memoriaIvuPct = val.toFixed(1);
                }
                ivu = modoIvuActivo ? parseFloat(memoriaIvuPct) : 0.0;
                document.getElementById('lblIvuBoton').innerText = modoIvuActivo ? ivu.toFixed(1) : "0.0";
            }
            
            document.getElementById('cajaPpl').className = modoSerruchoActivo ? "caja-data btn-on" : "caja-data btn-off";
            document.getElementById('cajaDesc').className = modoDescuentoActivo ? "caja-data btn-on" : "caja-data btn-off";
            document.getElementById('cajaTip').className = incluirPropina ? "caja-data btn-on" : "caja-data btn-off";
            document.getElementById('btnToggleIvu').className = modoIvuActivo ? "caja-data btn-on" : "caja-data btn-off";
            
            actualizarHeaderIndicadores(); calc();
        }

        // 🔌 CONTROLES HOLOGRÁFICOS DE APAGADO MAESTRO CON ENERGIZACIÓN ESCALONADA
        function solicitarApagado() {
            if (!sistemaEncendido) {
                togglePowerAccion();
                return;
            }
            reproducirSonido('menu');
            document.getElementById('visorConfirmarApagado').classList.add('activo');
        }

        function cerrarConfirmarApagado() {
            reproducirSonido('menu');
            document.getElementById('visorConfirmarApagado').classList.remove('activo');
        }

        function confirmarApagadoSi() {
            document.getElementById('visorConfirmarApagado').classList.remove('activo');
            togglePowerAccion();
        }

        function togglePowerAccion() {
            const lcd = document.getElementById('pantallaVerde');
            const chasis = document.getElementById('calcChasis');
            
            if (sistemaEncendido) {
                sistemaEncendido = false;
                reproducirSonido('apagar');
                lcd.classList.remove('power-on-crt');
                lcd.classList.add('power-off-crt'); 
                
                // 🚨 Limpiamos el Precio de forma inmediata al apagar
                sSub = "0"; 
                document.getElementById('lblSub').innerText = "0";
                
                setTimeout(() => {
                    if(!sistemaEncendido) chasis.classList.add('global-power-off'); 
                }, 400);
                toggleTeclasBloqueo(true);
            } else {
                // ⚡️ SECUENCIA DE ENERGIZACIÓN ESCALONADA DE ABAJO HACIA ARRIBA
                chasis.classList.remove('global-power-off');
                lcd.classList.remove('power-off-crt');
                toggleTeclasBloqueo(true); // Bloqueo temporal mientras se energiza
                
                // Capa 1: Botones inferiores de control (0ms)
                document.querySelectorAll('.btn-theme, .btn-receipt').forEach(b => b.style.opacity = "1");
                
                // Capa 2: Pad numérico ascendente (100ms)
                setTimeout(() => {
                    document.querySelectorAll('.pad-num .btn-key').forEach(b => b.style.opacity = "1");
                }, 100);
                
                // Capa 3: Botones de opciones y sus flechas (200ms)
                setTimeout(() => {
                    document.querySelectorAll('.row-opciones-pasos .caja-data, .btn-step').forEach(b => b.style.opacity = "1");
                }, 200);
                
                // Capa 4: Panel de precio unificado y apertura CRT de la pantalla LCD (300ms)
                setTimeout(() => {
                    sistemaEncendido = true;
                    lcd.classList.add('power-on-crt');
                    toggleTeclasBloqueo(false);
                    reproducirSonido('menu');
                    ejecutarResetTotal();
                }, 300);
                
                setTimeout(() => { lcd.classList.remove('power-on-crt'); }, 710);
            }
        }

        function toggleTeclasBloqueo(bloquear) {
            const botones = document.querySelectorAll('.btn-key, .caja-data, .btn-receipt, .btn-theme, .btn-step, .btn-add-embedded');
            botones.forEach(btn => {
                if (btn.id !== 'btnTogglePower' && btn.id !== 'btnTheme') {
                    btn.disabled = bloquear;
                    if (bloquear) { btn.style.pointerEvents = 'none'; } 
                    else { btn.style.pointerEvents = 'auto'; }
                }
            });
        }

        function ejecutarResetTotal() {
            sSub = "0"; cuentaAcumulada = 0; preciosGuardados = [];
            document.getElementById('listaPrecios').innerHTML = 'Lista vacía<span class="lcd-tipeo"></span>';
            document.getElementById('flechaGuia').style.display = "none"; sPpl = "0"; modoSerruchoActivo = false; memoriaSerruchoCortes = "2";
            document.getElementById('lblPpl').innerText = "N/A"; sDesc = "0"; memoriaDescuentoPct = "0"; modoDescuentoActivo = false; document.getElementById('lblDesc').innerText = "0";
            sTip = "15"; memoriaTipPct = "15"; incluirPropina = false;
            ivu = 0.0; sIvuModificado = "11.5"; memoriaIvuPct = "11.5"; modoIvuActivo = false;

        function actualizarHeaderIndicadores() {
            if (!sistemaEncendido) return;
            let subpartes = [];
            if (modoIvuActivo) { subpartes.push(`IVU: ${ivu.toFixed(1)}%`); }
            if (incluirPropina) { subpartes.push(`TIP: ${memoriaTipPct}%`); }
            if (modoDescuentoActivo) { subpartes.push(`DTO: -${memoriaDescuentoPct}%`); }

        }
        function seleccionarMenu(f) {

            const numSub = document.getElementById('lblSub'), numPpl = document.getElementById('lblPpl'), numDesc = document.getElementById('lblDesc'), numTip = document.getElementById('lblTip'), numIvu = document.getElementById('lblIvuBoton');

                mode = 'sub';

                modoDescuentoActivo = !modoDescuentoActivo;

                document.getElementById('lblDesc').innerText = modoDescuentoActivo ? sDesc : "0";
                mode = 'sub';
            } else if (f === 'ivu') {
                modoIvuActivo = !modoIvuActivo;
                ivu = modoIvuActivo ? (parseFloat(memoriaIvuPct) || 11.5) : 0.0;
                document.getElementById('lblIvuBoton').innerText = modoIvuActivo ? ivu.toFixed(1) : "0.0";
                mode = 'sub';
            } else { mode = f; }
            
            ['marcadorPrecioUnificado', 'cajaPpl', 'cajaDesc', 'cajaTip', 'btnToggleIvu'].forEach(id => {

            [numSub, numPpl, numDesc, numTip, numIvu].forEach(el => { if(el) el.classList.remove('blink-num'); });

            if (modoDescuentoActivo) document.getElementById('cajaDesc').className = "caja-data btn-on";
            if (modoSerruchoActivo) document.getElementById('cajaPpl').className = "caja-data btn-on";

            if (mode === 'sub') {

            actualizarHeaderIndicadores(); calc();

        // ⌨️ INGRESO NUMÉRICO EXCLUSIVO Y EXPANDIDO PARA EL CANAL DE PRECIO
        function num(c) {
            if (!sistemaEncendido) return;
            if (mode !== 'sub') mode = 'sub';
            
            reproducirSonido('tecla');
            if (sSub === "0" && c !== '.') sSub = "";
            if (c === '.' && sSub.includes('.')) return;
            sSub += c; 
            
            // 💰 Capacidad expandida hasta un millón ($1,000,000)
            if (parseFloat(sSub) > 1000000) sSub = "1000000";
            
            document.getElementById('lblSub').innerText = sSub;
            calc();
        }

        function bksp() {
            if (!sistemaEncendido) return;
            if (mode !== 'sub') mode = 'sub';
            
            reproducirSonido('tecla');
            sSub = sSub.slice(0, -1); 
            if (!sSub) sSub = "0"; 
            
            document.getElementById('lblSub').innerText = sSub;
            calc();
        }

        function ce() {
            if (!sistemaEncendido) return;
            reproducirSonido('tecla');
            sSub = "0"; 
            document.getElementById('lblSub').innerText = "0";
            
            if (mode !== 'sub') mode = 'sub';
            actualizarHeaderIndicadores(); 
            calc();
        }
        function addProducto() {
            if (!sistemaEncendido) return;
            let val = parseFloat(sSub) || 0;
            if (val > 0) {
                reproducirSonido('add');
                let dPct = modoDescuentoActivo ? (parseFloat(memoriaDescuentoPct) || 0) : 0;
                let rebaja = val * (dPct / 100), precioDescontado = val - rebaja;
                let ivuIndividual = precioDescontado * (ivu / 100);
                let totalArticulo = precioDescontado + ivuIndividual;
                
                preciosGuardados.push({ 
                    precio: val, descuento: rebaja, ivuCalculado: ivuIndividual, porcientoIvuUsado: ivu, total: totalArticulo 
                });
                
                cuentaAcumulada += val; sSub = "0"; document.getElementById('lblSub').innerText = "0";
                const con = document.getElementById('listaPrecios');
                
                con.innerHTML = preciosGuardados.map((item, i) => '<div>• (' + (i+1) + '): $' + item.total.toFixed(2) + ' <span style="font-size:8px; opacity:0.75;">(DTO:-$' + item.descuento.toFixed(2) + '/IVU:' + item.porcientoIvuUsado.toFixed(1) + '%)</span></div>').join('');
                
                if(preciosGuardados.length > 0) {
                    let totalConTaxAcumulado = preciosGuardados.reduce((sum, item) => sum + item.total, 0);
                    con.innerHTML += '<div style="border-top:1px dashed rgba(0,0,0,0.3); font-weight:900; margin-top:2px;">TOTAL: $' + totalConTaxAcumulado.toFixed(2) + '</div>';
                }
                
                const f = document.getElementById('flechaGuia'); 
                if (preciosGuardados.length >= 3) { f.style.display = "block"; } else { f.style.display = "none"; }
                
                con.scrollTop = con.scrollHeight; calc();
            }
        }

        function clr() {
            if (!sistemaEncendido) return;
            reproducirSonido('tecla');
            ejecutarResetTotal();
        }

        // 🧮 PROCESADOR MATEMÁTICO EN TIEMPO REAL
        function calc() {
            if (!sistemaEncendido) return;
            let numPplRaw = parseInt(sPpl);
            let nSerrucho = (modoSerruchoActivo && !isNaN(numPplRaw) && numPplRaw > 1) ? numPplRaw : 1;
            let dPct = modoDescuentoActivo ? (parseFloat(memoriaDescuentoPct) || 0) : 0;
            let tPct = incluirPropina ? (parseFloat(memoriaTipPct) || 0) : 0;
            
            let sumaPreciosGuardados = preciosGuardados.reduce((sum, item) => sum + item.precio, 0);
            let sumaDescuentosGuardados = preciosGuardados.reduce((sum, item) => sum + item.descuento, 0);
            let impuestoTotalAcumulado = preciosGuardados.reduce((sum, item) => sum + item.ivuCalculado, 0);
            
            let precioEnTeclado = parseFloat(sSub) || 0;
            let descuentoEnTeclado = precioEnTeclado * (dPct / 100);
            let precioDescontadoTeclado = precioEnTeclado - descuentoEnTeclado;
            let impuestoEnTeclado = precioDescontadoTeclado * (ivu / 100); 
            
            let nSub = sumaPreciosGuardados + precioEnTeclado;
            let rebajaTotal = sumaDescuentosGuardados + descuentoEnTeclado;
            let impuestoTotal = impuestoTotalAcumulado + impuestoEnTeclado;
            
            let subtotalDescontado = nSub - rebajaTotal;
            let propinaTotal = subtotalDescontado * (tPct / 100);
            let totalNetoGlobal = subtotalDescontado + impuestoTotal + propinaTotal;
            let porSerrucho = totalNetoGlobal / nSerrucho;
            
            document.getElementById('outDesc').innerText = '-\$' + rebajaTotal.toFixed(2); 
            document.getElementById('outTip').innerText = '\$' + propinaTotal.toFixed(2);
            document.getElementById('outIvu').innerText = '\$' + impuestoTotal.toFixed(2); 
            document.getElementById('outPer').innerText = totalNetoGlobal.toFixed(2);
            
            document.getElementById('rowDesc').style.opacity = modoDescuentoActivo ? "1" : "0.3";
            document.getElementById('rowTip').style.opacity = incluirPropina ? "1" : "0.3";
            document.getElementById('rowIvu').style.opacity = modoIvuActivo ? "1" : "0.3";

            if (modoSerruchoActivo) {
                document.getElementById('txtSerruchoLabelType').innerText = `SERRUCHO (C/U): `;
                document.getElementById('outPerPersonaLine').innerText = '$' + porSerrucho.toFixed(2);
                document.getElementById('rowPersonaCuota').style.opacity = "1"; 
            } else {
                document.getElementById('txtSerruchoLabelType').innerText = `SERRUCHO (C/U): N/A`;
                document.getElementById('outPerPersonaLine').innerText = ``;
                document.getElementById('rowPersonaCuota').style.opacity = "0.3"; 
            }
            
            document.getElementById('lblTip').innerText = incluirPropina ? memoriaTipPct : "0"; 
            document.getElementById('lblDesc').innerText = modoDescuentoActivo ? memoriaDescuentoPct : "0"; 
            document.getElementById('lblPpl').innerText = modoSerruchoActivo ? memoriaSerruchoCortes : "N/A";
            
            const artTxtEl = document.getElementById('lblArtText');
            if(artTxtEl && preciosGuardados.length > 0) {
                artTxtEl.innerHTML = `Cuenta (${preciosGuardados.length})`;
            }
            actualizarHeaderIndicadores();
        }

        // 🌌 CONSTRUCTOR DEL RECIBO HOLOGRÁFICO TIDY BORICUA FLUIDO Y SIN DESALINEACIONES
        function abrirHologramaRecibo() {
            if (!sistemaEncendido) return;
            reproducirSonido('caja');
            let numPplRaw = parseInt(sPpl); 
            let nPpl = (modoSerruchoActivo && !isNaN(numPplRaw) && numPplRaw > 1) ? numPplRaw : 1;
            let dPct = modoDescuentoActivo ? (parseFloat(memoriaDescuentoPct) || 0) : 0;
            let tPct = incluirPropina ? (parseFloat(memoriaTipPct) || 0) : 0;
            
            let sumaPreciosGuardados = preciosGuardados.reduce((sum, sum_item) => sum + sum_item.precio, 0);
            let sumaDescuentosGuardados = preciosGuardados.reduce((sum, sum_item) => sum + sum_item.descuento, 0);
            let impuestoTotalAcumulado = preciosGuardados.reduce((sum, sum_item) => sum + sum_item.ivuCalculado, 0);
            
            let precioEnTeclado = parseFloat(sSub) || 0;
            let descuentoEnTeclado = precioEnTeclado * (dPct / 100);
            let precioDescontadoTeclado = precioEnTeclado - descuentoEnTeclado;
            let impuestoEnTeclado = precioDescontadoTeclado * (ivu / 100);
            
            let nSub = sumaPreciosGuardados + precioEnTeclado;
            let rebajaTotal = sumaDescuentosGuardados + descuentoEnTeclado;
            let impuestoTotal = impuestoTotalAcumulado + impuestoEnTeclado;
            let subtotalDescontado = nSub - rebajaTotal;
            let propinaTotal = subtotalDescontado * (tPct / 100);
            let totalNetoGlobal = subtotalDescontado + impuestoTotal + propinaTotal;
            
            let txt = `===============================\n     DETALLE DE LA CUENTA\n===============================\n`;
            txt += `Fecha: ${new Date().toLocaleDateString()} | Hora: ${new Date().toLocaleTimeString()}\n`;
            txt += `-------------------------------\n`;
            
            if(preciosGuardados.length > 0) {
                txt += `Artículos Guardados:\n`;
                preciosGuardados.forEach((a, i) => {
                    // Padding estricto para fijar el IVU a dos decimales y evitar desalineaciones
                    let ivuFormateadoStr = a.porcientoIvuUsado.toFixed(2);
                    if(ivuFormateadoStr.length < 5) ivuFormateadoStr = "0" + ivuFormateadoStr;

                    txt += ` Art. #${i+1}\n`;
                    txt += `  Precio Base:       $${a.precio.toFixed(2).padStart(8)}\n`;
                    if(a.descuento > 0) txt += `  Descuento:        -$${a.descuento.toFixed(2).padStart(8)}\n`;
                    txt += `  IVU (${ivuFormateadoStr}%):    +$${a.ivuCalculado.toFixed(2).padStart(8)}\n`;
                    txt += `  Total Artículo:    $${a.total.toFixed(2).padStart(8)}\n`;
                    txt += ` -----------------------------\n`;
                });
            }
            
            txt += `Subtotal:          $${nSub.toFixed(2).padStart(8)}\n`;
            if(rebajaTotal > 0) txt += `Descuento Total:  -$${rebajaTotal.toFixed(2).padStart(8)}\n`;
            if(modoIvuActivo)   txt += `IVU Acumulado:     $${impuestoTotal.toFixed(2).padStart(8)}\n`;
            if(propinaTotal > 0) txt += `Propina (${tPct}%):     $${propinaTotal.toFixed(2).padStart(8)}\n`;
            txt += `===============================\n`;
            txt += `TOTAL:             $${totalNetoGlobal.toFixed(2).padStart(8)}\n`;
            txt += `===============================\n`;

            if(modoSerruchoActivo && numPplRaw > 1) {
                txt += `SERRUCHO COMPARTI'O: ${numPplRaw} panas\n`;
                txt += `CUOTA POR CABEZA:   $${(totalNetoGlobal / nPpl).toFixed(2).padStart(8)}\n`;
                txt += `===============================\n`;
            }
            txt += `    ¡Gracias por usar la app!`;
            
            textoReciboGlobal = txt;
            document.getElementById('textoContenidoHolo').innerText = txt;
            document.getElementById('btnCopiarHolo').innerText = "Copiar";
            document.getElementById('visorHolograma').classList.add('activo');
        }

        function cerrarHologramaRecibo() {
            reproducirSonido('menu');
            document.getElementById('visorHolograma').classList.remove('activo');
        }

        function copiarTextoHolograma() {
            if (!sistemaEncendido) return;
            reproducirSonido('caja');
            navigator.clipboard.writeText(textoReciboGlobal).then(() => {
                document.getElementById('btnCopiarHolo').innerText = "¡Copiado!";
            }).catch(() => {
                alert("Error al copiar, usa captura de pantalla.");
            });
        }

        function rotarTema() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch(e){}

            document.body.classList.remove(themes[temaActualIdx]);
            temaActualIdx = (temaActualIdx + 1) % themes.length;
            document.body.classList.add(themes[temaActualIdx]);
        }

        // Sincronización inicial al cargar la página
        actualizarHeaderIndicadores(); 
        calc();
    </script>
</body>
</html>
