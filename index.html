<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR IVU Splitter - Synthwave Edition</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(180deg, #1a0b2e 0%, #090214 100%);
        }
        .synth-font { font-family: 'Orbitron', sans-serif; }
        .neon-pink {
            box-shadow: 0 0 15px #ff007f, inset 0 0 5px #ff007f;
            border: 2px solid #ff007f;
        }
        .neon-text-pink { text-shadow: 0 0 8px #ff007f; }
        .neon-text-cyan { text-shadow: 0 0 8px #00f0ff; }
        .grid-bg {
            background-image: linear-gradient(rgba(255, 0, 127, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 127, 0.07) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="text-pink-100 min-h-screen flex items-center justify-center p-4 grid-bg" onload="calculate()">

    <div class="w-full max-w-md bg-[#120626]/90 rounded-2xl p-6 neon-pink backdrop-blur-md">
        
        <!-- HEADER -->
        <header class="text-center mb-6">
            <h1 class="synth-font text-2xl font-black text-[#00f0ff] tracking-widest neon-text-cyan">IVU SPLITTER</h1>
            <p class="text-xs uppercase text-[#ff007f] font-bold tracking-widest mt-1">PR Fiscal Terminal</p>
        </header>

        <!-- ENTRADA DE DINERO -->
        <div class="mb-4">
            <label class="block text-xs uppercase tracking-wider text-cyan-400 font-bold mb-1">Monto Subtotal (\$)</label>
            <input type="number" id="subtotal" value="0.00" step="0.01" class="w-full bg-[#1b0d3a] border border-[#ff007f]/50 rounded-xl py-2.5 px-4 text-xl font-mono text-[#00f0ff] focus:outline-none focus:border-[#00f0ff] text-center" oninput="calculate()">
        </div>

        <!-- SELECTOR DE IVU PUERTO RICO -->
        <div class="mb-4">
            <label class="block text-xs uppercase tracking-wider text-cyan-400 font-bold mb-1.5">Tasa Fiscal IVU</label>
            <div class="grid grid-cols-3 gap-2 text-xs font-bold text-center">
                <button id="ivu115" onclick="setIVU(11.5)" class="py-2 bg-[#ff007f] text-black rounded-lg synth-font">11.5%<span class="block text-[8px] opacity-80">General</span></button>
                <button id="ivu6" onclick="setIVU(6.0)" class="py-2 bg-[#1b0d3a] border border-[#ff007f]/40 rounded-lg synth-font">6.0%<span class="block text-[8px] text-slate-400">Alimentos</span></button>
                <button id="ivu0" onclick="setIVU(0.0)" class="py-2 bg-[#1b0d3a] border border-[#ff007f]/40 rounded-lg synth-font">0.0%<span class="block text-[8px] text-slate-400">Exento</span></button>
            </div>
        </div>

        <!-- PROPINAS Y PERSONAS -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <div>
                <label class="block text-xs uppercase tracking-wider text-cyan-400 font-bold mb-1">Propina (%)</label>
                <input type="number" id="tip" value="18" class="w-full bg-[#1b0d3a] border border-[#ff007f]/50 rounded-xl py-2 px-3 text-center text-[#00f0ff] font-mono focus:outline-none focus:border-[#00f0ff]" oninput="calculate()">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-cyan-400 font-bold mb-1">Personas</label>
                <input type="number" id="people" value="1" min="1" class="w-full bg-[#1b0d3a] border border-[#ff007f]/50 rounded-xl py-2 px-3 text-center text-[#00f0ff] font-mono focus:outline-none focus:border-[#00f0ff]" oninput="calculate()">
            </div>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div class="bg-[#0b031a] border border-[#00f0ff]/30 rounded-xl p-4 font-mono text-sm mb-4 space-y-2">
            <div class="flex justify-between text-slate-400"><span>IVU (Estatal/Mun):</span><span id="outIvu">\$0.00</span></div>
            <div class="flex justify-between text-slate-400"><span>Propina:</span><span id="outTip">\$0.00</span></div>
            <div class="flex justify-between text-base font-bold text-[#ff007f] pt-1 border-t border-[#ff007f]/20">
                <span class="synth-font text-xs tracking-wider">TOTAL CUENTA:</span><span id="outTotal" class="neon-text-pink">\$0.00</span>
            </div>
        </div>

        <!-- CUOTA INDIVIDUAL -->
        <div class="bg-gradient-to-r from-[#ff007f]/20 to-[#00f0ff]/10 p-3.5 rounded-xl border border-[#00f0ff]/40 text-center mb-4">
            <span class="text-[10px] uppercase tracking-widest text-[#00f0ff] font-bold block mb-0.5">Monto por Persona</span>
            <span id="outPerPerson" class="synth-font text-2xl font-black text-[#00f0ff] neon-text-cyan">\$0.00</span>
        </div>

        <!-- BOTÓN EXPORTAR -->
        <button onclick="copyBill()" class="w-full bg-gradient-to-r from-[#ff007f] to-[#b800c4] hover:scale-[1.02] text-white py-2.5 rounded-xl font-bold uppercase tracking-wider text-xs transition-all synth-font shadow-[0_0_10px_#ff007f]">
            Enviar por WhatsApp
        </button>
    </div>

    <script>
        let ivuRate = 11.5;

        function setIVU(perc) {
            ivuRate = perc;
            ['ivu115', 'ivu6', 'ivu0'].forEach(id => {
                document.getElementById(id).className = "py-2 bg-[#1b0d3a] border border-[#ff007f]/40 rounded-lg synth-font text-pink-100";
            });
            let activeId = perc === 11.5 ? 'ivu115' : perc === 6.0 ? 'ivu6?ivu6' : 'ivu0';
            // Corrección de ID dinámico para el botón de 6%
            if(perc === 6.0) activeId = 'ivu6';
            document.getElementById(activeId).className = "py-2 bg-[#ff007f] text-black rounded-lg synth-font";
            calculate();
        }

        function calculate() {
            let sub = parseFloat(document.getElementById('subtotal').value) || 0;
            let tipPerc = parseFloat(document.getElementById('tip').value) || 0;
            let ppl = Math.max(1, parseInt(document.getElementById('people').value) || 1);

            let ivu = sub * (ivuRate / 100);
            let tip = sub * (tipPerc / 100);
            let total = sub + ivu + tip;

            document.getElementById('outIvu').innerText = `$${ivu.toFixed(2)}`;
            document.getElementById('outTip').innerText = `$${tip.toFixed(2)}`;
            document.getElementById('outTotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('outPerPerson').innerText = `$${(total / ppl).toFixed(2)}`;
        }

        function copyBill() {
            let perPerson = document.getElementById('outPerPerson').innerText;
            let total = document.getElementById('outTotal').innerText;
            let ppl = document.getElementById('people').value;
            
            let text = `🌴 *SYNTH SPLITTER* 🌴\n`;
            text += `Cada uno paga: *${perPerson}*\n`;
            text += `Total Cuenta: ${total} (${ppl} personas)\n`;
            text += `¡Me lo envías por ATH Móvil! 🇵🇷`;

            navigator.clipboard.writeText(text).then(() => alert('¡Copiado para WhatsApp!'));
        }
    </script>
</body>
</html>
