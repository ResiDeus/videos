<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Win98_LottoPR.exe</title>
  <style>
    :root { --w-g: #c0c0c0; --w-d: #808080; --w-b: #000080; }
    * { box-sizing: border-box; font-family: 'MS Sans Serif', Tahoma, sans-serif; margin: 0; padding: 0; font-size: 12px; }
    body { background: #008080; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .window { width: 100%; max-width: 480px; background: var(--w-g); border: 2px solid; border-color: #fff var(--w-d) var(--w-d) #fff; padding: 3px; box-shadow: 2px 2px 10px #0008; }
    .title { background: linear-gradient(90deg, var(--w-b), #1084d0); color: #fff; padding: 3px 6px; font-weight: bold; display: flex; justify-content: space-between; }
    .panel { background: #fff; border: 2px solid; border-color: var(--w-d) #fff #fff var(--w-d); padding: 8px; margin: 8px 0; }
    .game { background: var(--w-g); border: 1px solid var(--w-d); padding: 6px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    .balls { display: flex; gap: 4px; }
    .ball { background: #ffffcc; border: 1px solid #000; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .wb { background: #ffcccc; color: #900; }
    .bc { background: #cce5ff; }
    .flex { display: flex; gap: 4px; margin-top: 5px; }
    input { flex: 1; padding: 3px; border: 2px solid; border-color: var(--w-d) #fff #fff var(--w-d); }
    button { background: var(--w-g); border: 2px solid; border-color: #fff var(--w-d) var(--w-d) #fff; padding: 3px 10px; font-weight: bold; cursor: pointer; }
    button:active { border-color: var(--w-d) #fff #fff var(--w-d); }
  </style>
</head>
<body>
  <div class="window">
    <div class="title"><span>💾 LottoPR.exe</span><span>❌</span></div>
    <div class="panel">
      <div style="font-weight:bold;margin-bottom:6px;color:var(--w-b)">LOTERÍA ELECTRÓNICA DE PR</div>
      <div id="games">
        <div class="game"><span>PEGA 2</span><div class="balls"><div class="ball">6</div><div class="ball">2</div><div class="ball wb">6</div></div></div>
        <div class="game"><span>PEGA 3</span><div class="balls"><div class="ball">4</div><div class="ball">2</div><div class="ball">3</div><div class="ball wb">5</div></div></div>
        <div class="game"><span>PEGA 4</span><div class="balls"><div class="ball">9</div><div class="ball">6</div><div class="ball">5</div><div class="ball">1</div><div class="ball wb">5</div></div></div>
        <div class="game"><span>LOTO CASH</span><div class="balls"><div class="ball">21</div><div class="ball">22</div><div class="ball">23</div><div class="ball">24</div><div class="ball">31</div><div class="ball bc">06</div></div></div>
      </div>
    </div>
    <div class="panel">
      <div style="font-weight:bold">VERIFICADOR RÁPIDO</div>
      <div class="flex">
        <input type="text" id="num" placeholder="Ej: 31 o 423">
        <button onclick="check()">Verificar</button>
      </div>
      <div id="msg" style="margin-top:5px; font-weight:bold; color:var(--w-b)"></div>
    </div>
    <div style="font-size:10px; display:flex; justify-content:space-between; padding:0 3px;"><span>Listo</span><span id="time"></span></div>
  </div>

  <script>
    // Base de datos del día integrada por bloqueo de CORS en navegadores
    const map = { "62": "Pega 2", "423": "Pega 3", "9651": "Pega 4", "212223243106": "Loto Cash" };
    document.getElementById('time').textContent = new Date().toLocaleDateString('es-PR');

    function check() {
      const val = document.getElementById('num').value.trim();
      const msg = document.getElementById('msg');
      if (!val) return;
      
      let win = Object.entries(map).find(([k]) => k === val || k.includes(val));
      if (win) {
        msg.textContent = `[OK] Coincide con número ganador de: ${win[1]}`;
        msg.style.color = "green";
      } else {
        msg.textContent = `[X] El número ${val} no registra premios hoy.`;
        msg.style.color = "var(--w-b)";
      }
    }
  </script>
</body>
</html>
