<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win98_PR_Desktop.exe</title>
  <style>
    :root { 
      --gray: #c0c0c0; 
      --dark: #808080; 
      --blue: #000080; 
      --navy: #1084d0; 
      --white: #fff; 
      --black: #000;
    }
    * { box-sizing: border-box; font-family: 'MS Sans Serif', Tahoma, sans-serif; font-size: 13px; margin: 0; padding: 0; user-select: none; }
    body { background: #008080; overflow: hidden; height: 100vh; position: relative; }
    
    /* Desktop Vacio (Aesthetic Y2K) */
    .desktop { height: calc(100vh - 40px); width: 100%; position: relative; }
    
    /* Motor de Ventanas Win98 Interactivas Ampliadas */
    .window { position: absolute; background: var(--gray); border: 2px solid; border-color: var(--white) var(--dark) var(--dark) var(--white); padding: 3px; box-shadow: 2px 2px 12px rgba(0,0,0,0.4); display: none; min-width: 400px; min-height: 350px; z-index: 10; }
    .title-bar { background: linear-gradient(90deg, var(--blue), var(--navy)); color: var(--white); padding: 6px 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: move; }
    .title-text { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 13px; }
    .title-controls { display: flex; gap: 3px; }
    .title-btn { background: var(--gray); border: 1px solid; border-color: var(--white) var(--dark) var(--dark) var(--white); width: 18px; height: 16px; font-size: 11px; line-height: 11px; text-align: center; font-weight: bold; color: var(--black); cursor: pointer; }
    .title-btn:active { border-color: var(--dark) var(--white) var(--white) var(--dark); padding: 1px 0 0 1px; }
    
    .win-body { padding: 12px; height: calc(100% - 28px); display: flex; flex-direction: column; overflow: auto; gap: 10px; }
    .sunken { background: var(--white); border: 2px solid; border-color: var(--dark) var(--white) var(--white) var(--dark); padding: 12px; color: var(--black); font-size: 13px; }
    
    /* Bordes para Redimensionar (Resize handles) */
    .resizer { position: absolute; width: 14px; height: 14px; background: transparent; right: 0; bottom: 0; cursor: se-resize; z-index: 99; }

    /* Calculadora IVU */
    .field { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
    .field label { font-size: 13px; font-weight: bold; }
    input, select { padding: 5px; border: 2px solid; border-color: var(--dark) var(--white) var(--white) var(--dark); background: var(--white); width: 140px; text-align: right; font-size: 13px; }
    
    /* Reproductor y Visualizador de Música */
    .track-list { flex-grow: 1; overflow-y: auto; font-size: 12px; max-height: 160px; }
    .track { padding: 6px; cursor: pointer; border-bottom: 1px dotted var(--dark); }
    .track:hover, .track.active { background: var(--blue); color: var(--white); }
    #visualizer { width: 100%; height: 75px; background: var(--black); border: 2px solid; border-color: var(--dark) var(--white) var(--white) var(--dark); margin-bottom: 8px; display: block; }
    
    /* Barra de Tareas e Inicio */
    .taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: var(--gray); border-top: 2px solid var(--white); display: flex; justify-content: space-between; align-items: center; padding: 2px 8px; z-index: 9999; }
    .start-btn { font-weight: bold; background: var(--gray); border: 2px solid; border-color: var(--white) var(--dark) var(--dark) var(--white); padding: 4px 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
    .start-btn:active, .start-btn.open { border-color: var(--dark) var(--white) var(--white) var(--dark); padding: 5px 9px 3px 11px; }
    
    /* Contenedor de apps en la barra */
    .taskbar-apps { flex-grow: 1; margin-left: 12px; display: flex; gap: 4px; height: 100%; align-items: center; }
    .task-button { background: var(--gray); border: 2px solid; border-color: var(--white) var(--dark) var(--dark) var(--white); padding: 4px 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; min-width: 120px; max-width: 160px; font-weight: bold; height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-button.active { border-color: var(--dark) var(--white) var(--white) var(--dark); background: #e0e0e0; font-style: italic; }

    /* Menú Inicio Desplegable */
    .start-menu { position: absolute; bottom: 38px; left: 2px; background: var(--gray); border: 2px solid; border-color: var(--white) var(--dark) var(--dark) var(--white); width: 230px; display: none; box-shadow: 2px 2px 12px rgba(0,0,0,0.5); z-index: 10000; }
    .start-sidebar { width: 35px; background: linear-gradient(180deg, var(--dark), var(--blue)); color: var(--white); writing-mode: vertical-lr; transform: rotate(180deg); text-align: center; font-weight: bold; padding: 8px; font-size: 15px; letter-spacing: 1px; }
    .menu-items { flex-grow: 1; display: flex; flex-direction: column; padding: 2px 0; }
    .menu-item { padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none; color: var(--black); font-size: 13px; }
    .menu-item:hover { background: var(--blue); color: var(--white); }
    
    .systray { background: var(--gray); border: 2px solid; border-color: var(--dark) var(--white) var(--white) var(--dark); padding: 4px 10px; font-weight: bold; font-size: 13px; }
    button.win-btn { background: var(--gray); border: 2px solid; border-color: var(--white) var(--dark) var(--dark) var(--white); padding: 5px 12px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 12px; }
    button.win-btn:active { border-color: var(--dark) var(--white) var(--white) var(--dark); }
  </style>
</head>
<body>

  <div class="desktop" onclick="closeStartMenu()"></div>

  <!-- VENTANA 1: CALCULADORA IVU -->
  <div id="win-ivu" class="window" style="top: 40px; left: 40px; width: 440px; height: 380px;">
    <div class="title-bar" onmousedown="dragStart(event, 'win-ivu')">
      <div class="title-text"><span style="font-size: 16px;">🧮</span> Calculadora IVU Avanzada</div>
      <div class="title-controls">
        <button class="title-btn" onclick="minimizeWin('win-ivu')">_</button>
        <button class="title-btn" onclick="closeWin('win-ivu')">×</button>
      </div>
    </div>
    <div class="win-body">
      <div class="field"><label>Cantidad (\$):</label><input type="number" id="amount" value="100" oninput="calcIVU()"></div>
      <div class="field">
        <label>Tipo de IVU:</label>
        <select id="ivu-type" onchange="calcIVU()">
          <option value="11.5">General (11.5%)</option>
          <option value="7">Alimentos Prep. (7%)</option>
        </select>
      </div>
      <div class="sunken" id="ivu-results" style="line-height: 1.8; flex-grow: 1;"></div>
    </div>
    <div class="resizer" onmousedown="resizeStart(event, 'win-ivu')"></div>
  </div>

  <!-- VENTANA 2: REPRODUCTOR REGGAETON -->
  <div id="win-music" class="window" style="top: 80px; left: 120px; width: 460px; height: 440px;">
    <div class="title-bar" onmousedown="dragStart(event, 'win-music')">
      <div class="title-text"><span style="font-size: 16px;">📻</span> Reggaeton Retro Player</div>
      <div class="title-controls">
        <button class="title-btn" onclick="minimizeWin('win-music')">_</button>
        <button class="title-btn" onclick="closeWin('win-music')">×</button>
      </div>
    </div>
    <div class="win-body">
      <div class="sunken" style="text-align: center; margin-bottom: 6px; font-weight: bold; background: #000; color: #0f0; font-family: monospace; font-size: 14px;" id="now-playing">DISCO DETENIDO</div>
      <canvas id="visualizer"></canvas>
      <audio id="audio-player" controls style="width: 100%; margin-bottom: 6px;"></audio>
      <div class="sunken track-list" id="playlist"></div>
      <button class="win-btn" onclick="addTrackPrompt()">+ Agregar MP3 (URL)</button>
    </div>
    <div class="resizer" onmousedown="resizeStart(event, 'win-music')"></div>
  </div>

  <!-- MENÚ INICIO DESPLEGABLE -->
  <div id="start-menu" class="start-menu">
    <div class="start-sidebar">Windows 98</div>
    <div class="menu-items">
      <div class="menu-item" onclick="openWin('win-ivu'); closeStartMenu();">
        <span style="font-size:18px;">🧮</span>
        <span>Calculadora IVU</span>
      </div>
      <div class="menu-item" onclick="openWin('win-music'); closeStartMenu();">
        <span style="font-size:18px;">📻</span>
        <span>Winamp Reggaeton</span>
      </div>
      
      <!-- ==========================================
           PUNTO 2: ACCESOS EN EL MENÚ INICIO (HTML)
           Cuando agregues una app, pon su acceso directo aquí siguiendo este formato:
           <div class="menu-item" onclick="openWin('ID_DE_TU_VENTANA'); closeStartMenu();">
             <span style="font-size:18px;">[EMOJI_ICONO]</span>
             <span>Nombre de tu App</span>
           </div>
           ========================================== -->
    </div>
  </div>

  <!-- BARRA DE TAREAS -->
  <div class="taskbar">
    <div class="start-btn" id="btn-start" onclick="toggleStartMenu(event)">
      <span style="font-size: 14px; margin-right: 2px;">❖</span><b>Inicio</b>
    </div>
    
    <div class="taskbar-apps" id="taskbar-apps-container"></div>
    
    <div class="systray" id="clock">00:00 AM</div>
  </div>

  <script>
    // --- MOTOR DE VENTANAS INTERACTIVAS (DRAG, DROP, FOCUS Y CIERRE REAL) ---
    let activeWin = null, offsetX = 0, offsetY = 0, zIndexCounter = 10;
    
    const windowRegistry = {
      'win-ivu': { title: 'Calculadora IVU', icon: '🧮', active: false },
      'win-music': { title: 'Winamp Reggaeton', icon: '📻', active: false }
    };

    function openWin(id) { 
            const w = document.getElementById(id); 
      w.style.display = 'block'; 
      w.style.zIndex = ++zIndexCounter; 
      windowRegistry[id].active = true;
      if(id === 'win-music') initAudio(); 
      updateTaskbarButtons();
    }
    
    function closeWin(id) { 
      document.getElementById(id).style.display = 'none'; 
      windowRegistry[id].active = false;
      updateTaskbarButtons();
    }

    function minimizeWin(id) {
      document.getElementById(id).style.display = 'none';
      updateTaskbarButtons();
    }

    function toggleWindowFromTaskbar(id) {
      const w = document.getElementById(id);
      if (w.style.display === 'block' && parseInt(w.style.zIndex) === zIndexCounter) {
        w.style.display = 'none';
      } else {
        w.style.display = 'block';
        w.style.zIndex = ++zIndexCounter;
      }
      updateTaskbarButtons();
    }

    function updateTaskbarButtons() {
      const container = document.getElementById('taskbar-apps-container');
      if (!container) return;
      container.innerHTML = '';
      
      Object.keys(windowRegistry).forEach(id => {
        const winEl = document.getElementById(id);
        if (winEl && windowRegistry[id].active) {
          const isOpen = winEl.style.display === 'block';
          const isFocused = isOpen && parseInt(winEl.style.zIndex) === zIndexCounter;
          
          const btn = document.createElement('div');
          btn.className = `task-button ${isFocused ? 'active' : ''}`;
          btn.onclick = () => toggleWindowFromTaskbar(id);
          btn.innerHTML = `<span>${windowRegistry[id].icon}</span> <span>${windowRegistry[id].title}</span>`;
          container.appendChild(btn);
        }
      });
    }
    
    function dragStart(e, id) {
      if(e.target.classList.contains('title-btn')) return;
      activeWin = document.getElementById(id); zIndexCounter++; activeWin.style.zIndex = zIndexCounter;
      offsetX = e.clientX - activeWin.offsetLeft; offsetY = e.clientY - activeWin.offsetTop;
      document.addEventListener('mousemove', dragMove); document.addEventListener('mouseup', dragEnd);
      updateTaskbarButtons();
    }
    function dragMove(e) { if (activeWin) { activeWin.style.left = (e.clientX - offsetX) + 'px'; activeWin.style.top = (e.clientY - offsetY) + 'px'; } }
    function dragEnd() { activeWin = null; document.removeEventListener('mousemove', dragMove); document.removeEventListener('mouseup', dragEnd); }

    // --- MOTOR DE REDIMENSIONAMIENTO (RESIZE) ---
    let resizeWin = null, startW = 0, startH = 0, startX = 0, startY = 0;
    function resizeStart(e, id) {
      e.preventDefault(); resizeWin = document.getElementById(id);
      startW = parseInt(document.defaultView.getComputedStyle(resizeWin).width, 10);
      startH = parseInt(document.defaultView.getComputedStyle(resizeWin).height, 10);
      startX = e.clientX; startY = e.clientY;
      document.addEventListener('mousemove', resizeMove); document.addEventListener('mouseup', resizeEnd);
    }
    function resizeMove(e) { if (resizeWin) { resizeWin.style.width = (startW + e.clientX - startX) + 'px'; resizeWin.style.height = (startH + e.clientY - startY) + 'px'; } }
    function resizeEnd() { resizeWin = null; document.removeEventListener('mousemove', resizeMove); document.removeEventListener('mouseup', resizeEnd); }

    // --- CONTROL DEL MENÚ DE INICIO ---
    function toggleStartMenu(e) { e.stopPropagation(); const m = document.getElementById('start-menu'); const b = document.getElementById('btn-start'); if(m.style.display==='flex'){ m.style.display='none'; b.classList.remove('open'); }else{ m.style.display='flex'; b.classList.add('open'); }}
    function closeStartMenu() { document.getElementById('start-menu').style.display = 'none'; document.getElementById('btn-start').classList.remove('open'); }
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }); }, 1000);

    // --- CALCULADORA DEL IVU DE PUERTO RICO ---
    function calcIVU() {
      const amt = parseFloat(document.getElementById('amount').value) || 0;
      const type = parseFloat(document.getElementById('ivu-type').value);
      let estatal = 0, municipal = 0;
      if (type === 11.5) { estatal = amt * 0.105; municipal = amt * 0.01; } 
      else { estatal = amt * 0.06; municipal = amt * 0.01; }
      const totalIvu = estatal + municipal;
      document.getElementById('ivu-results').innerHTML = `Estatal (${type === 11.5 ? '10.5%' : '6%'}): $${estatal.toFixed(2)}<br>Municipal (1%): $${municipal.toFixed(2)}<br><b>Total IVU (${type}%): $${totalIvu.toFixed(2)}</b><br><br><b style="font-size: 15px;">Gran Total: $${(amt + totalIvu).toFixed(2)}</b>`;
    }
    calcIVU();

    // --- PLAYLIST CON ENLACES MP3 REALES ---
    const canciones = [
      { titulo: "Daddy Yankee - Gasolina (2004)", url: "http://radio.plaza.one/mp3" },
      { titulo: "Daddy Yankee - Rompe (2005)", url: "https://archive.org" },
      { titulo: "Casa de Leones - No Te Veo (2007)", url: "https://archive.org" }
    ];

    const audio = document.getElementById('audio-player');
    function renderPlaylist() { document.getElementById('playlist').innerHTML = canciones.map((c, i) => `<div class="track" onclick="playTrack(${i})">📻 ${c.titulo}</div>`).join(''); }
    
    function playTrack(i) {
      document.querySelectorAll('.track').forEach((t, idx) => t.classList.toggle('active', idx === i));
      document.getElementById('now-playing').textContent = canciones[i].titulo.toUpperCase();
      audio.src = canciones[i].url; audio.crossOrigin = "anonymous"; audio.play();
    }
    
    function addTrackPrompt() {
      const title = prompt("Nombre del tema:"); const url = prompt("Enlace directo MP3:");
      if (title && url) { canciones.push({ titulo: title, url: url }); renderPlaylist(); }
    }
    renderPlaylist();

    // --- VISUALIZADOR DE AUDIO ---
    let audioCtx, analyser, source, canvas, canvasCtx, audioInit = false;
    function initAudio() {
      if (audioInit) return; audioInit = true;
      canvas = document.getElementById('visualizer'); canvasCtx = canvas.getContext('2d');
      audio.addEventListener('play', () => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser); analyser.connect(audioCtx.destination);
          analyser.fftSize = 64;
          drawVisualizer();
        }
      });
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);
      canvasCtx.fillStyle = '#000'; canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      const barWidth = (canvas.width / bufferLength) * 1.5;
      let barX = 0;
      for (let i = 0; i < bufferLength; i++) {
        let barHeight = dataArray[i] / 4;
        canvasCtx.fillStyle = `rgb(${barHeight * 3}, 255, 0)`;
        canvasCtx.fillRect(barX, canvas.height - barHeight, barWidth - 2, barHeight);
        barX += barWidth;
      }
    }

    // ==========================================
    // PUNTO 3: LOGICA DE TUS PRÓXIMAS APPS (JAVASCRIPT)
    // ==========================================
    console.log("Win98 Desktop Inicializado sin dependencias externas.");
  </script>
</body>
</html>
