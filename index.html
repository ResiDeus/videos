<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PR IVU Calc</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        html, body { margin: 0; width: 100vw; height: 100vh; background: #0c0414; overflow: hidden; }
        /* Chasis vertical expandido estilo beeper/terminal */
        .chasis { width: 335px; height: 580px; background: #241434; border: 4px solid #ff007f; box-shadow: 0 0 25px #ff007f66; }
        /* Pantalla LCD de alto contraste */
        .lcd { background: #92b043; border: 3px solid #000; color: #000; }
        /* Botonera masiva optimizada para el tacto en la zona inferior */
        .btn-t { background: #3c1e54; border-bottom: 5px solid #1a0826; border-right: 2px solid #1a0826; color: #00f0ff; font-size: 1.6rem; font-weight: bold; }
        .btn-t:active { border-bottom: 1px solid #1a0826; border-right: 1px solid #1a0826; transform: translateY(4px); background: #ff007f; color: #000; }
        .btn-off { background: #1a0826; border: 2px solid #ff007f; color: #ff007f; }
        .btn-on { background: #ff007f; border: 2px solid #fff; color: #000; font-weight: bold; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 10px #ff007f; } 50% { box-shadow: 0 0 22px #ff007f; } }
        .on-anim { animation: glow 1.5s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); color: #00f0ff; } 50% { opacity: 1; transform: scale(1.2); color: #ff007f; filter: drop-shadow(0 0 4px #ff007f); } }
        .star { animation: twinkle 1.2s infinite ease-in-out; position: absolute; font-size: 10px; pointer-events: none; }
    </style>
</head>
<body class="absolute inset-0 flex items-center justify-center select-none">

    <div class="chasis rounded-3xl p-5 flex flex-col justify-between shrink-0">
        
        <!-- BLOQUE SUPERIOR: PANTALLA LCD -->
        <div class="lcd rounded-xl p-3.5 flex flex-col justify-between text-right h-28 font-mono font-bold mb-4">
            <div class="flex justify-between border-b border-black/30 pb-1 text-[10px]">
                <span>TERMINAL FISCAL PR</span><span id="txtIvu">IVU: 11.5%</span>
            </div>
            <div class="text-[11px] space-y-0.5">
                <div>PROPINA (18%): <span id="outTip">\$0.00</span></div>
                <div>IVU LIQUIDO: <span id="outIvu">\$0.00</span></div>
                <div class="text-2xl font-black mt-1">TOTAL C/U: \$<span id="outPer">0.00</span></div>
            </div>
        </div>

        <!-- MENUS DE DATOS SELECCIONABLES -->
        <div class="grid grid-cols-2 gap-3 text-xs font-bold relative mb-3">
            <div class="relative h-16 flex items-center justify-center">
                <span class="star top-0 left-1">✦</span><span class="star bottom-0 right-1" style="animation-delay:0.4s">★</span>
                <div id="cajaSub" class="btn-on on-anim w-full h-full rounded-xl cursor-pointer text-center flex flex-col justify-center" onclick="focusF('sub')">
                    <span class="text-[10px] uppercase opacity-80">1. Cuenta Base</span>
                    <span class="font-mono text-base font-black">\$<span id="lblSub">0</span></span>
                </div>
            </div>
            <div class="relative h-16 flex items-center justify-center">
                <span class="star top-0 right-1" style="animation-delay:0.2s">★</span><span class="star bottom-0 left-1" style="animation-delay:0.6s">✦</span>
                <div id="cajaPpl" class="btn-off w-full h-full rounded-xl cursor-pointer text-center flex flex-col justify-center" onclick="focusF('ppl')">
                    <span class="text-[10px] uppercase opacity-80">2. Personas</span>
                    <span class="font-mono text-base font-black"><span id="lblPpl">0</span></span>
                </div>
            </div>
        </div>

        <!-- SELECTOR TASA IVU -->
        <div class="grid grid-cols-3 gap-2 text-xs font-bold mb-4">
            <button id="ivu115" onclick="setI(11.5)" class="py-2.5 rounded-xl btn-on">11.5%</button>
            <button id="ivu6" onclick="setI(6.0)" class="py-2.5 rounded-xl btn-off">6.0%</button>
            <button id="ivu0" onclick="setI(0.0)" class="py-2.5 rounded-xl btn-off">0.0%</button>
        </div>

        <!-- BLOQUE INFERIOR: TECLADO NUMÉRICO MAXIMIZADO CON BACKSPACE -->
        <div class="grid grid-cols-4 gap-2.5 flex-1 pt-2">
            <!-- Fila 1 -->
            <button onclick="num('7')" class="btn-t rounded-2xl">7</button>
            <button onclick="num('8')" class="btn-t rounded-2xl">8</button>
            <button onclick="num('9')" class="btn-t rounded-2xl">9</button>
            <button onclick="backspace()" class="text-lg rounded-2xl font-bold bg-amber-950 border border-amber-500 text-amber-200 active:bg-amber-500 active:text-black flex items-center justify-center">←</button>
            
            <!-- Fila 2 y 3 fusionadas en rejilla estándar -->
            <button onclick="num('4')" class="btn-t rounded-2xl">4</button>
            <button onclick="num('5')" class="btn-t rounded-2xl">5</button>
            <button onclick="num('6')" class="btn-t rounded-2xl">6</button>
            <button onclick="clr()" class="row-span-3 text-base rounded-2xl font-bold bg-red-900 border border-red-500 text-red-200 active:bg-red-500 active:text-black flex items-center justify-center">C</button>
            
            <!-- Fila 3 -->
            <button onclick="num('1')" class="btn-t rounded-2xl">1</button>
            <button onclick="num('2')" class="btn-t rounded-2xl">2</button>
            <button onclick="num('3')" class="btn-t rounded-2xl">3</button>
            
            <!-- Fila 4 -->
            <button onclick="num('0')" class="btn-t col-span-2 rounded-2xl">0</button>
            <button onclick="num('.')" class="btn-t rounded-2xl">.</button>
        </div>
    </div>

    <script>
        let ivu = 11.5, mode = 'sub', sSub = "0", sPpl = "0";
        
        function focusF(f) {
            mode = f;
            document.getElementById('cajaSub').className = f === 'sub' ? "btn-on on-anim w-full h-full rounded-xl cursor-pointer text-center flex flex-col justify-center" : "btn-off w-full h-full rounded-xl cursor-pointer text-center flex flex-col justify-center";
            document.getElementById('cajaPpl').className = f === 'ppl' ? "btn-on on-anim w-full h-full rounded-xl cursor-pointer text-center flex flex-col justify-center" : "btn-off w-full h-full rounded-xl cursor-pointer text-center flex flex-col justify-center";
        }
        
        function setI(p) {
            ivu = p;
            ['ivu115', 'ivu6', 'ivu0'].forEach(id => document.getElementById(id).className = "py-2.5 rounded-xl btn-off");
            document.getElementById(p === 11.5 ? 'ivu115' : p === 6.0 ? 'ivu6' : 'ivu0').className = "py-2.5 rounded-xl btn-on";
            document.getElementById('txtIvu').innerText = `IVU: ${p.toFixed(1)}%`;
            calc();
        }
        
        function num(c) {
            if (mode === 'sub') {
                if (sSub === "0" && c !== '.') sSub = "";
                if (c === '.' && sSub.includes('.')) return;
                sSub += c; document.getElementById('lblSub').innerText = sSub;
            } else {
                if (c === '.') return;
                if (sPpl === "0") sPpl = "";
                sPpl += c; document.getElementById('lblPpl').innerText = sPpl;
            }
            calc();
        }

        function backspace() {
            if (mode === 'sub') {
                sSub = sSub.slice(0, -1);
                if (sSub === "" || sSub === "-") sSub = "0";
                document.getElementById('lblSub').innerText = sSub;
            } else {
                sPpl = sPpl.slice(0, -1);
                if (sPpl === "") sPpl = "0";
                document.getElementById('lblPpl').innerText = sPpl;
            }
            calc();
        }
        
        function clr() {
            if (mode === 'sub') { sSub = "0"; document.getElementById('lblSub').innerText = "0"; }
            else { sPpl = "0"; document.getElementById('lblPpl').innerText = "0"; }
            calc();
        }
        
        function calc() {
            let nSub = parseFloat(sSub) || 0, nPpl = parseInt(sPpl) || 0;
            let vTip = nSub * 0.18, vIvu = nSub * (ivu / 100);
            document.getElementById('outTip').innerText = `$${vTip.toFixed(2)}`;
            document.getElementById('outIvu').innerText = `$${vIvu.toFixed(2)}`;
            document.getElementById('outPer').innerText = ((nSub + vTip + vIvu) / (nPpl > 0 ? nPpl : 1)).toFixed(2);
        }
    </script>
</body>
</html>
