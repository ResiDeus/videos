<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de ResiDeus</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, #09011a 0%, #2c044d 100%); overflow: hidden; position: relative; font-family: monospace; }
        
        .sky { position: absolute; width: 100%; height: 100%; background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1.5px 1px at 75px 120px, #fff9, transparent); background-size: 380px 380px; z-index: 1; animation: twk 4s infinite linear; }
        .grid3d { position: absolute; width: 100%; height: 40%; bottom: 0; background-image: linear-gradient(rgba(255, 0, 127, 0.2) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 0, 127, 0.2) 2px, transparent 2px); background-size: 40px 40px; transform: perspective(180px) rotateX(65deg); transform-origin: top center; z-index: 1; animation: gM 2.5s infinite linear; }
        @keyframes twk { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes gM { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }
        
        .chasis { width: 327px; height: auto; min-height: 480px; background: #241434; border: 4px solid #ff007f; box-shadow: 0 0 25px #ff007f80; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; padding: 8px; gap: 6px; }
        
        .lcd { width: 100%; height: 165px; background: #92b043; border: 2px solid #000; border-radius: 14px; color: #000; box-shadow: inset 0 4px 10px rgba(0,0,0,0.4); font-weight: bold; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .lcd-header { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid rgba(0,0,0,0.2); }
        
        /* CAJA CON CONTENEDOR DE SCROLL E INDICADOR UNIVERSAL PARA SAFARI */
        .lcd-wrapper { position: relative; flex-grow: 1; display: flex; flex-direction: column; margin: 4px 0; max-height: 45px; }
        .lcd-historial { flex-grow: 1; font-size: 11px; overflow-y: scroll; text-align: left; padding-right: 4px; -webkit-overflow-scrolling: touch; }
        
        /* Barra para navegadores compatibles (PC/Android) */
        .lcd-historial::-webkit-scrollbar { width: 5px; display: block; }
        .lcd-historial::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        .lcd-historial::-webkit-scrollbar-thumb { background: #ff007f; border-radius: 4px; }
        
        /* FLECHA FLOTANTE RETRO PARA MÓVILES (Desaparece al scrollear mediante JS) */
        .scroll-hint { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: rgba(0,0,0,0.6); animation: bounce 1.2s infinite ease-in-out; pointer-events: none; display: none; background: rgba(146, 176, 67, 0.9); padding: 0 2px; border-radius: 3px; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
        
        .lcd-body { text-align: right; font-size: 11px; }
        .lcd-total { font-size: 26px; font-weight: 900; }

        .row-menus { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .caja-data { padding: 8px; border-radius: 12px; text-align: center; cursor: pointer; font-size: 11px; }
        .btn-off { background: #1a0826; border: 2px solid #ff007f; color: #ff007f; opacity: 0.5; }
        .btn-on { background: #ff007f; border: 2px solid #fff; color: #000; font-weight: bold; }
        
        .caja-data * { pointer-events: none; }
        .lbl-title { color: #fff; font-weight: 900; text-transform: uppercase; display: block; }
        .lbl-val { font-size: 15px; font-weight: 900; }
        
        .row-config { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .btn-cfg { padding: 6px 0; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; text-align: center; }

        .pad-num { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .btn-key { height: 36px; background: linear-gradient(180deg, #44186c 0%, #170529 100%); border: 1px solid #00f0ff44; border-radius: 6px; color: #00f0ff; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .btn-back { background: linear-gradient(180deg, #5c2c06 0%, #241001 100%); color: #fbbf24; }

        .row-acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-bottom: 2px; }
        .btn-clear { height: 38px; background: linear-gradient(180deg, #701a1a 0%, #300707 100%); border: 1px solid #ef4444; border-radius: 8px; color: #f87171; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn-add { height: 38px; background: linear-gradient(180deg, #0f5c3a 0%, #052416 100%); border: 1px solid #22c55e; border-radius: 8px; color: #4ade80; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

        @keyframes glow { 0%, 100% { box-shadow: 0 0 10px #ff007f; } 50% { box-shadow: 0 0 18px #ff007f; } }
        .on-anim { animation: glow 1.5s infinite ease-in-out; }
    </style>
</head>
<body>
    <div class="sky"></div>
    <div class="grid3d"></div>

    <div class="chasis">
        <div class="lcd">
            <div class="lcd-header"><span id="lblArt">CALCULADORA</span><span id="txtIvu">IVU: 11.5%</span></div>
            
            <div class="lcd-wrapper">
                <!-- Se añade un detector de scroll 'onscroll' para la flecha -->
                <div class="lcd-historial" id="listaPrecios" onscroll="detectarDesplazamiento()"><i>Lista vacía...</i></div>
                <div class="scroll-hint" id="flechaGuia">▼ deslizar</div>
            </div>

            <div class="lcd-body">
                <div id="rowTip" style="opacity: 0.2;">PROPINA (18%): <span id="outTip">$0.00</span></div>
                <div>IVU: <span id="outIvu">$0.00</span></div>
                <div class="lcd-total"><span id="lblTotalType">TOTAL</span>: $<span id="outPer">0.00</span></div>
            </div>
        </div>
        <div class="row-menus">
            <div id="cajaSub" class="caja-data btn-on on-anim" onclick="seleccionarMenu('sub')">
                <span class="lbl-title">Cuenta</span>
                <span class="lbl-val">\$<span id="lblSub">0</span></span>
            </div>
            <div id="cajaPpl" class="caja-data btn-off" onclick="seleccionarMenu('ppl')">
                <span class="lbl-title">Personas</span>
                <span class="lbl-val"><span id="lblPpl">OFF</span></span>
            </div>
        </div>

        <div class="row-config">
            <button id="ivu115" onclick="setI(11.5)" class="btn-cfg btn-on">11.5%</button>
            <button id="ivu6" onclick="setI(6.0)" class="btn-cfg btn-off">6.0%</button>
            <button id="ivu0" onclick="setI(0.0)" class="btn-cfg btn-off">0.0%</button>
            <button id="btnPropina" onclick="toggleTip()" class="btn-cfg btn-off">PROPINA</button>
        </div>

        <div class="pad-num">
            <button onclick="num('7')" class="btn-key">7</button><button onclick="num('8')" class="btn-key">8</button><button onclick="num('9')" class="btn-key">9</button>
            <button onclick="num('4')" class="btn-key">4</button><button onclick="num('5')" class="btn-key">5</button><button onclick="num('6')" class="btn-key">6</button>
            <button onclick="num('1')" class="btn-key">1</button><button onclick="num('2')" class="btn-key">2</button><button onclick="num('3')" class="btn-key">3</button>
            <button onclick="num('.')" class="btn-key">.</button><button onclick="num('0')" class="btn-key">0</button><button onclick="bksp()" class="btn-key btn-back">←</button>
        </div>

        <div class="row-acciones">
            <button onclick="clr()" class="btn-clear">C Reset</button>
            <button onclick="addProducto()" class="btn-add">+ Añadir</button>
        </div>
    </div>

    <script>
        let ivu = 11.5, mode = 'sub', sSub = "0", sPpl = "0", incluirPropina = false, modoPersonasActivo = false;
        let preciosGuardados = [], cuentaAcumulada = 0;

        function reproducirSonido(tipo) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (tipo === 'menu') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                } else if (tipo === 'tecla') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(350, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                } else if (tipo === 'add') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(450, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(950, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                }
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function seleccionarMenu(f) {
            reproducirSonido('menu');
            if (f === 'sub') {
                modoPersonasActivo = false;
                document.getElementById('lblPpl').innerText = "OFF";
                document.getElementById('lblTotalType').innerText = "TOTAL";
                mode = 'sub';
            } else {
                modoPersonasActivo = true;
                if (sPpl === "0" || sPpl === "") sPpl = "2";
                document.getElementById('lblPpl').innerText = sPpl;
                document.getElementById('lblTotalType').innerText = "C/U";
                mode = 'ppl';
            }
            document.getElementById('cajaSub').className = mode === 'sub' ? "caja-data btn-on on-anim" : "caja-data btn-off";
            document.getElementById('cajaPpl').className = mode === 'ppl' ? "caja-data btn-on on-anim" : "caja-data btn-off";
            calc();
        }

        function toggleTip() {
            reproducirSonido('menu'); incluirPropina = !incluirPropina;
            document.getElementById('btnPropina').className = incluirPropina ? "btn-cfg btn-on" : "btn-cfg btn-off";
            document.getElementById('rowTip').style.opacity = incluirPropina ? "1" : "0.2";
            calc();
        }

        function setI(p) {
            reproducirSonido('menu'); ivu = p;
            ['ivu115', 'ivu6', 'ivu0'].forEach(id => document.getElementById(id).className = "btn-cfg btn-off");
            document.getElementById(p === 11.5 ? 'ivu115' : p === 6.0 ? 'ivu6' : 'ivu0').className = "btn-cfg btn-on";
            document.getElementById('txtIvu').innerText = `IVU: ${p.toFixed(1)}%`;
            calc();
        }

        function num(c) {
            reproducirSonido('tecla');
            if (mode === 'sub') {
                if (sSub === "0" && c !== '.') sSub = "";
                if (c === '.' && sSub.includes('.')) return;
                sSub += c; document.getElementById('lblSub').innerText = sSub;
            } else {
                if (c === '.' || sPpl === "0" || sPpl === "2") sPpl = "";
                sPpl += c; document.getElementById('lblPpl').innerText = sPpl;
            }
            calc();
        }

        function bksp() {
            reproducirSonido('tecla');
            if (mode === 'sub') {
                sSub = sSub.slice(0, -1); if (!sSub) sSub = "0";
                document.getElementById('lblSub').innerText = sSub;
            } else {
                sPpl = sPpl.slice(0, -1); if (!sPpl) sPpl = "0";
                document.getElementById('lblPpl').innerText = sPpl;
            }
            calc();
        }

        function addProducto() {
            let val = parseFloat(sSub) || 0;
            if (val > 0) {
                reproducirSonido('add'); preciosGuardados.push(val); cuentaAcumulada += val;
                sSub = "0"; document.getElementById('lblSub').innerText = "0";
                const con = document.getElementById('listaPrecios');
                con.innerHTML = preciosGuardados.map((p, i) => `<div>• Art #${i+1}: $${p.toFixed(2)}</div>`).join('');
                
                // CONTROL DE FLECHA GUÍA EN MÓVIL
                const f = document.getElementById('flechaGuia');
                if (con.scrollHeight > con.clientHeight) {
                    f.style.display = "block"; // Se activa la advertencia si hay contenido oculto abajo
                }
                
                con.scrollTop = con.scrollHeight;
                calc();
            }
        }

        // ESCONDE EL AVISO EN CUANTO EL USUARIO TOCA E INTERACTÚA CON LA LISTA
        function detectarDesplazamiento() {
            document.getElementById('flechaGuia').style.display = "none";
        }

        function clr() {
            reproducirSonido('tecla');
            if (mode === 'sub') {
                sSub = "0"; cuentaAcumulada = 0; preciosGuardados = [];
                document.getElementById('lblSub').innerText = "0";
                document.getElementById('listaPrecios').innerHTML = "<i>Lista vacía...</i>";
                document.getElementById('flechaGuia').style.display = "none";
            } else { sPpl = "1"; document.getElementById('lblPpl').innerText = "1"; }
            calc();
        }

        function calc() {
            let nSub = cuentaAcumulada + (parseFloat(sSub) || 0);
            let nPpl = modoPersonasActivo ? (parseInt(sPpl) || 1) : 1;
            document.getElementById('outTip').innerText = `$${(incluirPropina ? nSub * 0.18 : 0).toFixed(2)}`;
            document.getElementById('outIvu').innerText = `$${(nSub * (ivu / 100)).toFixed(2)}`;
            document.getElementById('outPer').innerText = ((nSub + (incluirPropina ? nSub * 0.18 : 0) + (nSub * (ivu / 100))) / (nPpl > 0 ? nPpl : 1)).toFixed(2);
            document.getElementById('lblArt').innerText = preciosGuardados.length ? `Cuenta (${preciosGuardados.length} art.)` : "CALCULADORA";
        }
    </script>
</body>
</html>
