<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de ResiDeus</title>

    <!-- CONFIGURACIÓN ESPECÍFICA PARA PANTALLA DE INICIO DE IPHONE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ResiDeus">
    
    <!-- ENLACES CORREGIDOS CON RUTA RELATIVA PARA TU PORTFOLIO -->
    <link rel="icon" type="image/jpeg" href="./icon.jpg?v=200">
    <link rel="apple-touch-icon" type="image/jpeg" href="./icon.jpg?v=200">

    <style>
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            overflow: hidden; position: relative; font-family: monospace; 
            transition: background 0.3s ease; 
        }
        
        body.theme-cyberpunk { background: linear-gradient(180deg, #09011a 0%, #2c044d 100%) !important; }
        body.theme-retro-gold { background: linear-gradient(180deg, #1c1917 0%, #44403c 100%) !important; }
        body.theme-matrix { background: linear-gradient(180deg, #022c22 0%, #050505 100%) !important; }
        body.theme-sunset { background: linear-gradient(180deg, #451a03 0%, #78350f 100%) !important; }

        .sky { position: absolute; width: 100%; height: 100%; background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1.5px 1px at 75px 120px, #fff9, transparent); background-size: 380px 380px; z-index: 1; animation: twk 4s infinite linear; pointer-events: none; }
        .grid3d { position: absolute; width: 100%; height: 40%; bottom: 0; background-size: 40px 40px; transform: perspective(180px) rotateX(65deg); transform-origin: top center; z-index: 1; animation: gM 2.5s infinite linear; pointer-events: none; }
        
        body.theme-cyberpunk .grid3d { background-image: linear-gradient(rgba(255, 0, 127, 0.2) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 0, 127, 0.2) 2px, transparent 2px); }
        body.theme-retro-gold .grid3d { background-image: linear-gradient(rgba(217, 119, 6, 0.2) 2px, transparent 2px), linear-gradient(90deg, rgba(217, 119, 6, 0.2) 2px, transparent 2px); }
        body.theme-matrix .grid3d { background-image: linear-gradient(rgba(16, 185, 129, 0.2) 2px, transparent 2px), linear-gradient(90deg, rgba(16, 185, 129, 0.2) 2px, transparent 2px); }
        body.theme-sunset .grid3d { background-image: linear-gradient(rgba(239, 68, 68, 0.2) 2px, transparent 2px), linear-gradient(90deg, rgba(239, 68, 68, 0.2) 2px, transparent 2px); }

        @keyframes twk { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes gM { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }
        
        .chasis { width: 340px; height: auto; min-height: 580px; background: #241434; border: 4px solid #ff007f; box-shadow: 0 0 25px #ff007f80; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; padding: 8px; gap: 6px; transition: all 0.3s ease; }
        body.theme-retro-gold .chasis { background: #292524; border-color: #d97706; box-shadow: 0 0 25px #d9770680; }
        body.theme-matrix .chasis { background: #0a0a0a; border-color: #10b981; box-shadow: 0 0 25px #10b98180; }
        body.theme-sunset .chasis { background: #451a03; border-color: #f97316; box-shadow: 0 0 25px #f9731680; }

        .lcd { width: 100%; height: 175px; background: #92b043; border: 2px solid #000; border-radius: 14px; color: #000; box-shadow: inset 0 4px 10px rgba(0,0,0,0.4); font-weight: bold; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: filter 0.05s ease, opacity 0.05s ease; }
        .lcd-header { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid rgba(0,0,0,0.2); }
        .lcd-wrapper { position: relative; flex-grow: 1; display: flex; flex-direction: column; margin: 4px 0; max-height: 55px; }
        .lcd-historial { flex-grow: 1; font-size: 11px; overflow-y: auto; text-align: left; padding-right: 4px; -webkit-overflow-scrolling: touch; }
        .lcd-historial::-webkit-scrollbar { width: 5px; display: block; }
        .lcd-historial::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        body.theme-cyberpunk .lcd-historial::-webkit-scrollbar-thumb { background: #ff007f; }
        body.theme-retro-gold .lcd-historial::-webkit-scrollbar-thumb { background: #d97706; }
        body.theme-matrix .lcd-historial::-webkit-scrollbar-thumb { background: #10b981; }
        body.theme-sunset .lcd-historial::-webkit-scrollbar-thumb { background: #f97316; }

        @keyframes terminalGlitch {
            0% { opacity: 0.4; filter: hue-rotate(90deg) contrast(1.5); }
            50% { opacity: 0.9; filter: skewX(-3deg) brightness(1.3); }
            100% { opacity: 1; filter: none; }
        }
        .glitch-active { animation: terminalGlitch 0.12s steps(2, start) infinite; }

        .scroll-hint { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: rgba(0,0,0,0.6); animation: bounce 1.2s infinite ease-in-out; pointer-events: none; display: none; background: rgba(146, 176, 67, 0.9); padding: 0 2px; border-radius: 3px; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
        .lcd-body { text-align: right; font-size: 10px; line-height: 1.2; }
        .lcd-total { font-size: 24px; font-weight: 900; }

        .row-menus { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .caja-data { padding: 4px 2px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 9px; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 52px; }
        .btn-off { background: #1a0826; border: 2px solid #ff007f; color: #ff007f; opacity: 0.5; box-shadow: none !important; }
        body.theme-retro-gold .btn-off { background: #1c1917; border-color: #d97706; color: #d97706; }
        body.theme-matrix .btn-off { background: #022c22; border-color: #10b981; color: #10b981; }
        body.theme-sunset .btn-off { background: #292524; border-color: #f97316; color: #f97316; }
        .btn-on { background: #ff007f; border: 2px solid #fff; color: #000; font-weight: bold; }
        body.theme-retro-gold .btn-on { background: #d97706; color: #fff; }
        body.theme-matrix .btn-on { background: #10b981; color: #000; }
        body.theme-sunset .btn-on { background: #f97316; color: #fff; }
        
        .caja-data * { pointer-events: none; }
        .lbl-title { font-weight: 900; text-transform: uppercase; display: block; margin-bottom: 2px; color: #fff; }
        body.theme-cyberpunk .btn-off .lbl-title { color: #ff007f; }
        body.theme-retro-gold .btn-off .lbl-title { color: #d97706; }
        body.theme-matrix .btn-off .lbl-title { color: #10b981; }
        body.theme-sunset .btn-off .lbl-title { color: #f97316; }
        .lbl-val { font-size: 13px; font-weight: 900; display: inline-block; line-height: 1; }
        
        @keyframes blinkFast { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
        .blink-num { animation: blinkFast 0.5s infinite steps(2, start); text-shadow: 0 0 10px rgba(255,255,255,0.6); }
        .row-config { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .btn-cfg { padding: 6px 0; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; text-align: center; }

        .pad-num { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 2px; }
        .btn-key { height: 38px; background: linear-gradient(180deg, #44186c 0%, #170529 100%); border: 1px solid #00f0ff44; border-radius: 6px; color: #00f0ff; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; display: flex; justify-content: center; align-items: center; font-family: monospace; }
        .btn-key.btn-action-text { font-size: 9px; }
        body.theme-retro-gold .btn-key { background: linear-gradient(180deg, #57534e 0%, #1c1917 100%); border-color: #a8a29e; color: #fbbf24; }
        body.theme-matrix .btn-key { background: linear-gradient(180deg, #064e3b 0%, #022c22 100%); border-color: #34d399; color: #34d399; }
        body.theme-sunset .btn-key { background: linear-gradient(180deg, #7c2d12 0%, #451a03 100%); border-color: #fb923c; color: #fdba74; }
        
        .btn-back { background: linear-gradient(180deg, #44186c 0%, #170529 100%) !important; color: #00f0ff !important; border-color: #00f0ff44 !important; }
        body.theme-retro-gold .btn-back { background: linear-gradient(180deg, #57534e 0%, #1c1917 100%) !important; color: #fbbf24 !important; border-color: #a8a29e !important; }
        body.theme-matrix .btn-back { background: linear-gradient(180deg, #064e3b 0%, #022c22 100%) !important; color: #34d399 !important; border-color: #34d399 !important; }
        body.theme-sunset .btn-back { background: linear-gradient(180deg, #7c2d12 0%, #451a03 100%) !important; color: #fdba74 !important; border-color: #fb923c !important; }
        .btn-key:disabled { opacity: 0.2 !important; cursor: not-allowed !important; filter: grayscale(100%); background: #1a0b24 !important; color: #555 !important; }

        .row-acciones-inferior { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 2px; }
        .btn-theme, .btn-receipt { border-radius: 10px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; display: flex; justify-content: center; align-items: center; font-family: monospace; height: 28px; font-size: 8px; opacity: 0.8; }
        body.theme-cyberpunk .btn-theme { background: #1a0826; border: 2px solid #ff007f; color: #ff007f; }
        body.theme-cyberpunk .btn-receipt { background: #ff007f; border: 2px solid #fff; color: #000; }
        body.theme-retro-gold .btn-theme { background: #1c1917; border: 2px solid #d97706; color: #d97706; }
        body.theme-retro-gold .btn-receipt { background: #d97706; border: 2px solid #fff; color: #fff; }
        body.theme-matrix .btn-theme { background: #022c22; border: 2px solid #10b981; color: #10b981; }
        body.theme-matrix .btn-receipt { background: #10b981; border: 2px solid #fff; color: #000; }
        body.theme-sunset .btn-theme { background: #292524; border: 2px solid #f97316; color: #f97316; }
        body.theme-sunset .btn-receipt { background: #f97316; border: 2px solid #fff; color: #fff; }

        @keyframes glow { 0%, 100% { box-shadow: 0 0 8px #ff007f; opacity: 0.85; } 50% { box-shadow: 0 0 12px #ff007f; opacity: 1; } }
        body.theme-retro-gold .on-anim { animation: glowGold 1.2s infinite ease-in-out; }
        body.theme-matrix .on-anim { animation: glowMatrix 1.2s infinite ease-in-out; }
        body.theme-sunset .on-anim { animation: glowSunset 1.2s infinite ease-in-out; }
        .on-anim { animation: glow 1.2s infinite ease-in-out; }
        @keyframes glowGold { 0%, 100% { box-shadow: 0 0 8px #d97706; } 50% { box-shadow: 0 0 12px #d97706; } }
        @keyframes glowMatrix { 0%, 100% { box-shadow: 0 0 8px #10b981; } 50% { box-shadow: 0 0 12px #10b981; } }
        @keyframes glowSunset { 0%, 100% { box-shadow: 0 0 8px #f97316; } 50% { box-shadow: 0 0 12px #f97316; } }
    </style>
</head>
<body class="theme-cyberpunk">
    <div class="sky"></div>
    <div class="grid3d"></div>
    <div class="chasis" id="calcChasis">
        <div class="lcd" id="pantallaVerde">
            <div class="lcd-header">
                <span id="txtHeaderIndicadores">IVU: 11.5%</span>
            </div>
            <div class="lcd-wrapper">
                <div class="listaPrecios-container" style="flex-grow: 1; position: relative; display: flex; flex-direction: column; overflow: hidden;">
                    <div class="lcd-historial" id="listaPrecios" onscroll="detectarDesplazamiento()"><i>Lista vacía...</i></div>
                    <div class="scroll-hint" id="flechaGuia">▼ deslizar</div>
                </div>
            </div>
            <div class="lcd-body">
                <div id="rowDesc" style="opacity: 0.3; transition: opacity 0.15s ease;">DESCUENTO: <span id="outDesc">-$0.00</span></div>
                <div id="rowTip" style="opacity: 0.2; transition: opacity 0.15s ease;">PROPINA: <span id="outTip">$0.00</span></div>
                <div>IVU: <span id="outIvu">$0.00</span></div>
                
                <!-- TOTAL PRINCIPAL FIJO ARRIBA -->
                <div class="lcd-total" style="margin-bottom: 1px;">TOTAL: $<span id="outPer">0.00</span></div>
                
                <!-- SERRUCHO COMPARTIDO EN MAYÚSCULAS -->
                <div id="rowPersonaCuota" style="opacity: 0.25; font-size: 11px; margin-top: 1px; transition: opacity 0.15s ease;"><span id="txtSerruchoLabelType">SERRUCHO (C/U): N/A</span><span id="outPerPersonaLine"></span></div>
            </div>
        </div>

        <div class="row-menus">
            <div id="cajaSub" class="caja-data btn-on on-anim" onclick="seleccionarMenu('sub')">
                <span class="lbl-title">Cuenta</span>
                <span class="lbl-val">$<span id="lblSub" class="blink-num">0</span></span>
            </div>
            <div id="cajaPpl" class="caja-data btn-off" onclick="seleccionarMenu('ppl')">
                <span class="lbl-title">Serrucho</span>
                <span class="lbl-val"><span id="lblPpl">N/A</span></span>
            </div>
            <div id="cajaDesc" class="caja-data btn-off" onclick="seleccionarMenu('desc')">
                <span class="lbl-title">DTO:</span>
                <span class="lbl-val">-<span id="lblDesc">0</span>%</span>
            </div>
            <div id="cajaTip" class="caja-data btn-off" onclick="seleccionarMenu('tip')">
                <span class="lbl-title">Propina</span>
                <span class="lbl-val"><span id="lblTip">0</span>%</span>
            </div>
        </div>

        <div class="row-config">
            <button id="ivu115" onclick="setI(11.5)" class="btn-cfg btn-on">11.5%</button>
            <button id="ivu7" onclick="setI(7.0)" class="btn-cfg btn-off">7.0%</button>
            <button id="ivu0" onclick="setI(0.0)" class="btn-cfg btn-off">0.0%</button>
        </div>

        <div class="pad-num">
            <button id="btnResetGlobal" class="btn-key btn-action-text" onclick="clr()">Resetear</button>
            <button id="btnCeGlobal" class="btn-key btn-action-text" onclick="ce()">Clear</button>
            <button id="btnAnadirGlobal" class="btn-key btn-action-text" onclick="addProducto()">+ Añadir</button>
            <button onclick="num('7')" class="btn-key">7</button><button onclick="num('8')" class="btn-key">8</button><button onclick="num('9')" class="btn-key">9</button>
            <button onclick="num('4')" class="btn-key">4</button><button onclick="num('5')" class="btn-key">5</button><button onclick="num('6')" class="btn-key">6</button>
            <button onclick="num('1')" class="btn-key">1</button><button onclick="num('2')" class="btn-key">2</button><button onclick="num('3')" class="btn-key">3</button>
            <button id="btnPunto" onclick="num('.')" class="btn-key">.</button><button onclick="num('0')" class="btn-key">0</button><button onclick="bksp()" class="btn-key btn-back">←</button>
        </div>

        <div class="row-acciones-inferior">
            <button class="btn-theme" onclick="rotarTema()">TEMA</button>
            <button class="btn-receipt" onclick="exportarRecibo()">RECIBO</button>
        </div>
    </div>
    <script>
        let ivu = 11.5, mode = 'sub', sSub = "0", incluirPropina = false, modoPersonasActivo = false, modoDescuentoActivo = false;
        let sDesc = "0", sTip = "15", sPpl = "2"; 
        let memoriaDescuentoPct = "0", memoriaTipPct = "15", memoriaSerruchoCortes = "2";
        let preciosGuardados = [], cuentaAcumulada = 0;
        let themes = ['theme-cyberpunk', 'theme-retro-gold', 'theme-matrix', 'theme-sunset'], temaActualIdx = 0, recienEntradoAPropina = false;

        function dispararEfectoGlitch() {
            const lcd = document.getElementById('pantallaVerde');
            if (lcd) {
                lcd.classList.add('glitch-active');
                setTimeout(() => { lcd.classList.remove('glitch-active'); }, 120);
            }
        }

        function reproducirSonido(tipo) {
            dispararEfectoGlitch();
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (tipo === 'menu') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                } else if (tipo === 'tecla') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(350, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                } else if (tipo === 'add') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(450, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(950, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                }
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function actualizarHeaderIndicadores() {
            let texto = `IVU: ${ivu.toFixed(1)}%`;
            if (incluirPropina) { texto += ` | TIP: ${memoriaTipPct}%`; }
            if (modoDescuentoActivo) { texto += ` | DTO: -${memoriaDescuentoPct}%`; }
            document.getElementById('txtHeaderIndicadores').innerText = texto;
        }

        function seleccionarMenu(f) {
            reproducirSonido('menu');
            const btnReset = document.getElementById('btnResetGlobal'), btnAnadir = document.getElementById('btnAnadirGlobal'), btnPunto = document.getElementById('btnPunto');
            const numSub = document.getElementById('lblSub'), numPpl = document.getElementById('lblPpl'), numDesc = document.getElementById('lblDesc'), numTip = document.getElementById('lblTip');

            if (f === 'ppl') {
                if (mode === 'ppl') { modoPersonasActivo = false; mode = 'sub'; }
                else { modoPersonasActivo = true; mode = 'ppl'; sPpl = memoriaSerruchoCortes; }
            } else if (f === 'tip') {
                if (mode === 'tip') { incluirPropina = false; mode = 'sub'; recienEntradoAPropina = false; }
                else { incluirPropina = true; mode = 'tip'; sTip = memoriaTipPct; recienEntradoAPropina = true; }
            } else if (f === 'desc') {
                if (mode === 'desc') { modoDescuentoActivo = false; mode = 'sub'; }
                else { modoDescuentoActivo = true; mode = 'desc'; sDesc = memoriaDescuentoPct; }
            } else { mode = f; recienEntradoAPropina = false; }
            
            ['cajaSub', 'cajaPpl', 'cajaDesc', 'cajaTip'].forEach(id => { document.getElementById(id).className = 'caja-data btn-off'; });
            [numSub, numPpl, numDesc, numTip].forEach(el => { if(el) el.classList.remove('blink-num'); });

            if (modoDescuentoActivo && mode !== 'desc') document.getElementById('cajaDesc').className = "caja-data btn-on";
            if (modoPersonasActivo && mode !== 'ppl') document.getElementById('cajaPpl').className = "caja-data btn-on";

            if (mode === 'sub') {
                numPpl.innerText = modoPersonasActivo ? memoriaSerruchoCortes : "N/A";
                numDesc.innerText = modoDescuentoActivo ? memoriaDescuentoPct : "0";
                numTip.innerText = incluirPropina ? memoriaTipPct : "0";
                btnReset.disabled = false; btnAnadir.disabled = false; btnPunto.disabled = false; 
                numSub.classList.add('blink-num'); document.getElementById('cajaSub').className = "caja-data btn-on on-anim";
            } else if (mode === 'ppl') {
                numPpl.innerText = sPpl; btnReset.disabled = false; btnAnadir.disabled = true; btnPunto.disabled = true; 
                numPpl.classList.add('blink-num'); document.getElementById('cajaPpl').className = "caja-data btn-on on-anim";
            } else if (mode === 'desc') {
                numDesc.innerText = sDesc; btnReset.disabled = false; btnAnadir.disabled = true; btnPunto.disabled = true;
                numDesc.classList.add('blink-num'); document.getElementById('cajaDesc').className = "caja-data btn-on on-anim";
            } else if (mode === 'tip') {
                numTip.innerText = sTip; btnReset.disabled = false; btnAnadir.disabled = true; btnPunto.disabled = true;
                numTip.classList.add('blink-num'); document.getElementById('cajaTip').className = "caja-data btn-on on-anim";
            }
            if (incluirPropina && mode !== 'tip') document.getElementById('cajaTip').className = "caja-data btn-on";
            actualizarHeaderIndicadores(); calc();
        }

        function setI(p) {
            reproducirSonido('menu'); ivu = p;
            ['ivu115', 'ivu7', 'ivu0'].forEach(id => document.getElementById(id).className = "btn-cfg btn-off");
            document.getElementById(p === 11.5 ? 'ivu115' : p === 7.0 ? 'ivu7' : 'ivu0').className = "btn-cfg btn-on";
            actualizarHeaderIndicadores(); calc();
        }
        function num(c) {
            reproducirSonido('tecla');
            if (mode === 'sub') {
                if (sSub === "0" && c !== '.') sSub = "";
                if (c === '.' && sSub.includes('.')) return;
                sSub += c; if(parseFloat(sSub) > 99999) sSub = "99999";
                document.getElementById('lblSub').innerText = sSub;
            } else if (mode === 'ppl') {
                if (sPpl === "N/A" || sPpl === "0") sPpl = "";
                // REGLA NUEVA: Permite ingresar libremente el 0 y el 1 sin bloqueos automáticos en caliente
                sPpl = (sPpl + c).substring(0, 2);
                memoriaSerruchoCortes = sPpl === "" ? "0" : sPpl;
                modoPersonasActivo = true; document.getElementById('lblPpl').innerText = sPpl === "" ? "0" : sPpl;
            } else if (mode === 'desc') {
                if (c === '.' || sDesc === "0") sDesc = "";
                sDesc = (sDesc + c).substring(0, 2);
                memoriaDescuentoPct = sDesc === "" ? "0" : sDesc;
                modoDescuentoActivo = true; document.getElementById('lblDesc').innerText = sDesc === "" ? "0" : sDesc;
            } else if (mode === 'tip') {
                if (recienEntradoAPropina || sTip === "0") { sTip = ""; recienEntradoAPropina = false; }
                if (c === '.') return; 
                sTip = (sTip + c).substring(0, 2);
                memoriaTipPct = sTip === "" ? "0" : sTip;
                incluirPropina = true; document.getElementById('lblTip').innerText = sTip === "" ? "0" : sTip;
            }
            calc();
        }

        function bksp() {
            reproducirSonido('tecla');
            if (mode === 'sub') { sSub = sSub.slice(0, -1); if (!sSub) sSub = "0"; document.getElementById('lblSub').innerText = sSub; }
            else if (mode === 'ppl') { 
                sPpl = sPpl.slice(0, -1); 
                // REGLA NUEVA: Muestra 0 fijo si borras todo en el serrucho
                if (!sPpl) { sPpl = "0"; }
                memoriaSerruchoCortes = sPpl; document.getElementById('lblPpl').innerText = sPpl; 
            }
            else if (mode === 'desc') { sDesc = sDesc.slice(0, -1); if (!sDesc) { sDesc = "0"; } memoriaDescuentoPct = sDesc; document.getElementById('lblDesc').innerText = sDesc; }
            else if (mode === 'tip') { sTip = sTip.slice(0, -1); if (!sTip) { sTip = "0"; } memoriaTipPct = sTip; document.getElementById('lblTip').innerText = sTip; }
            calc();
        }

        function ce() {
            reproducirSonido('tecla');
            if (mode === 'sub') { sSub = "0"; document.getElementById('lblSub').innerText = "0"; }
            else if (mode === 'ppl') { sPpl = "0"; memoriaSerruchoCortes = "0"; modoPersonasActivo = true; document.getElementById('lblPpl').innerText = "0"; }
            else if (mode === 'desc') { sDesc = "0"; memoriaDescuentoPct = "0"; modoDescuentoActivo = true; document.getElementById('lblDesc').innerText = "0"; }
            else if (mode === 'tip') { sTip = "0"; memoriaTipPct = "0"; recienEntradoAPropina = true; incluirPropina = true; document.getElementById('lblTip').innerText = "0"; }
            actualizarHeaderIndicadores(); calc();
        }

        function addProducto() {
            let val = parseFloat(sSub) || 0;
            if (val > 0) {
                reproducirSonido('add');
                let dPct = modoDescuentoActivo ? (parseInt(memoriaDescuentoPct) || 0) : 0;
                let rebaja = val * (dPct / 100), precioDescontado = val - rebaja, ivuIndividual = precioDescontado * (ivu / 100), totalArticulo = precioDescontado + ivuIndividual;
                preciosGuardados.push({ precio: val, descuento: rebaja, ivuCalculado: ivuIndividual, total: totalArticulo });
                cuentaAcumulada += val; sSub = "0"; document.getElementById('lblSub').innerText = "0";
                const con = document.getElementById('listaPrecios');
                con.innerHTML = preciosGuardados.map((item, i) => `<div>• Artículo #\${i+1}: \[{item.total.toFixed(2)} (Neto:\]{item.precio.toFixed(2)})</div>`).join('');
                if(preciosGuardados.length > 0) {
                    let totalConTaxAcumulado = preciosGuardados.reduce((sum, item) => sum + item.total, 0);
                    con.innerHTML += `<div style="border-top:1px dashed rgba(0,0,0,0.3); font-weight:900; margin-top:2px;">Base Acum. (w/IVU): \$\${totalConTaxAcumulado.toFixed(2)}</div>`;
                }
                const f = document.getElementById('flechaGuia'); if (con.scrollHeight > con.clientHeight) f.style.display = "block";
                con.scrollTop = con.scrollHeight; calc();
            }
        }

        function detectarDesplazamiento() { document.getElementById('flechaGuia').style.display = "none"; }

        function clr() {
            reproducirSonido('tecla'); sSub = "0"; cuentaAcumulada = 0; preciosGuardados = [];
            document.getElementById('lblSub').innerText = "0"; document.getElementById('listaPrecios').innerHTML = "<i>Lista vacía...</i>";
            document.getElementById('flechaGuia').style.display = "none"; sPpl = "0"; modoPersonasActivo = false; memoriaSerruchoCortes = "2";
            document.getElementById('lblPpl').innerText = "N/A"; sDesc = "0"; memoriaDescuentoPct = "0"; modoDescuentoActivo = false; document.getElementById('lblDesc').innerText = "0";
            sTip = "15"; memoriaTipPct = "15"; incluirPropina = false; recienEntradoAPropina = false; seleccionarMenu('sub');
        }

        function calc() {
            let numPplRaw = parseInt(sPpl);
            // REGLA SERRUCHO BORICUA: Si dejas 0 o 1, el motor calcula la division entre 1 de forma segura tras bastidores para no romper la matemática
            let nSerrucho = (modoPersonasActivo && !isNaN(numPplRaw) && numPplRaw > 1) ? numPplRaw : 1;

            let dPct = modoDescuentoActivo ? (parseInt(memoriaDescuentoPct) || 0) : 0;
            let tPct = incluirPropina ? (parseInt(memoriaTipPct) || 0) : 0;
            let nSub = cuentaAcumulada + (parseFloat(sSub) || 0);
            
            let rebajaTotal = nSub * (dPct / 100);
            let subtotalDescontado = nSub - rebajaTotal;
            let impuestoTotal = subtotalDescontado * (ivu / 100);
            let propinaTotal = subtotalDescontado * (tPct / 100);
            let totalNetoGlobal = subtotalDescontado + impuestoTotal + propinaTotal;
            let porSerrucho = totalNetoGlobal / nSerrucho;
            
            document.getElementById('outDesc').innerText = `-\$\${rebajaTotal.toFixed(2)}`; 
            document.getElementById('outTip').innerText = `\$\${propinaTotal.toFixed(2)}`;
            document.getElementById('outIvu').innerText = `\$\${impuestoTotal.toFixed(2)}`; 
            document.getElementById('outPer').innerText = totalNetoGlobal.toFixed(2);
            document.getElementById('outDescPctText').innerText = modoDescuentoActivo ? memoriaDescuentoPct : "0";
            
            document.getElementById('rowDesc').style.opacity = modoDescuentoActivo ? "1" : "0.3";
            document.getElementById('rowTip').style.opacity = incluirPropina ? "1" : "0.3";

            if (modoPersonasActivo) {
                document.getElementById('txtSerruchoLabelType').innerText = `SERRUCHO (C/U): `;
                document.getElementById('outPerPersonaLine').innerText = `\$\${porSerrucho.toFixed(2)}`;
                document.getElementById('rowPersonaCuota').style.opacity = "1";
            } else {
                document.getElementById('txtSerruchoLabelType').innerText = `SERRUCHO (C/U): N/A`;
                document.getElementById('outPerPersonaLine').innerText = ``;
                document.getElementById('rowPersonaCuota').style.opacity = "0.3";
            }
            
            document.getElementById('lblTip').innerText = incluirPropina ? memoriaTipPct : "0"; 
            document.getElementById('txtTipPct').innerText = incluirPropina ? `${memoriaTipPct}%` : "0%";
            document.getElementById('lblDesc').innerText = modoDescuentoActivo ? memoriaDescuentoPct : "0"; 
            if (mode !== 'ppl') { document.getElementById('lblPpl').innerText = modoPersonasActivo ? memoriaSerruchoCortes : "N/A"; }
            document.getElementById('lblArt').innerText = preciosGuardados.length ? `Cuenta (${preciosGuardados.length} artículos)` : "Calculadora de ResiDeus";
            actualizarHeaderIndicadores();
        }

        function rotarTema() {
            reproducirSonido('menu'); document.body.classList.remove(themes[temaActualIdx]);
            temaActualIdx = (temaActualIdx + 1) % themes.length; document.body.classList.add(themes[temaActualIdx]); calc();
        }
            reproducirSonido('add');
            let numPplRaw = parseInt(sPpl); 
            let nPpl = (modoPersonasActivo && !isNaN(numPplRaw) && numPplRaw > 1) ? numPplRaw : 1;
            let dPct = modoDescuentoActivo ? (parseInt(memoriaDescuentoPct) || 0) : 0;
            let tPct = incluirPropina ? (parseInt(memoriaTipPct) || 0) : 0;
            let nSub = cuentaAcumulada + (parseFloat(sSub) || 0);
            let rebajaTotal = nSub * (dPct / 100), subtotalDescontado = nSub - rebajaTotal, impuestoTotal = subtotalDescontado * (ivu / 100), propinaTotal = subtotalDescontado * (tPct / 100), totalNetoGlobal = subtotalDescontado + impuestoTotal + propinaTotal;
            
            // FORMATO CRILLO BORICUA ADAPTADO AL SERRUCHO
            let txt = `=== Calculadora de ResiDeus ===\nFecha: ${new Date().toLocaleString()}\nIVU Config: ${ivu.toFixed(1)}%\n-----------------------\n`;
            if(preciosGuardados.length > 0) { txt += `Historial Guardado:\n`; preciosGuardados.forEach((a, i) => { txt += `  Artículo #${i+1}: $${a.total.toFixed(2)} -> Neto: $${a.precio.toFixed(2)}\n`; }); txt += `-----------------------\n`; }
            txt += `Desglose de Totales:\n Importe Base: $${nSub.toFixed(2)}\n`;
            if(dPct > 0) txt += ` Descuento (-${dPct}%): -$${rebajaTotal.toFixed(2)}\n`;
            if(tPct > 0) txt += ` Propina (${tPct}%): $${propinaTotal.toFixed(2)}\n`;
            txt += ` IVU Calculado: $${impuestoTotal.toFixed(2)}\n Total Neto: $${totalNetoGlobal.toFixed(2)}\n`;
            if(modoPersonasActivo && nPpl > 1) txt += `-----------------------\n SERRUCHO COMPARTIDO: ${nPpl} personas\n CUOTA INDIVIDUAL (TOTAL C/U): $${(totalNetoGlobal / nPpl).toFixed(2)}\n`;
            txt += `=======================\n¡Gracias por usar la Calculadora de ResiDeus!`;
            
            navigator.clipboard.writeText(txt).then(() => {
                alert("¡Recibo copiado al portapapeles con éxito!\n\n" + txt);
            }).catch(() => {
                alert(txt);
            });
        }
        actualizarHeaderIndicadores(); calc();
    </script>
</body>
