<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR IVU Terminal - Synthwave Calc</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background: linear-gradient(180deg, #120424 0%, #05010d 100%);
        }
        .synth-font { font-family: 'Orbitron', sans-serif; }
        
        /* Chasis de la calculadora */
        .calc-case {
            background: #190a2a;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
        }
        
        /* Pantalla digital de la calculadora */
        .calc-screen {
            background: #090214;
            border: 2px solid #ff007f;
            box-shadow: inset 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* Estados de botones (Activo vs Inactivo) */
        .btn-inactive {
            background: #25123e;
            border: 1px solid #ff007f;
            color: #ff007f;
            box-shadow: none;
            transition: all 0.2s ease;
        }
        .btn-active {
            background: #ff007f;
            border: 1px solid #ffffff;
            color: #000000;
            box-shadow: 0 0 15px #ff007f;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        /* Fondo de rejilla retro */
        .grid-bg {
            background-image: linear-gradient(rgba(255, 0, 127, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 127, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .neon-text-cyan { text-shadow: 0 0 8px #00f0ff; }
        .neon-text-pink { text-shadow: 0 0 8px #ff007f; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 grid-bg text-pink-100">

    <!-- CHASIS DE CALCULADORA LITERAL -->
    <div class="w-full max-w-sm calc-case rounded-3xl p-5 flex flex-col space-y-4">
        
        <!-- PANTALLA DIGITAL (DISPLAY PRINCIPAL) -->
        <div class="calc-screen rounded-2xl p-4 flex flex-col justify-between text-right h-36">
            <div class="flex justify-between items-center border-b border-[#ff007f]/20 pb-1">
                <span class="synth-font text-[9px] text-cyan-400 uppercase tracking-widest neon-text-cyan">PR Fiscal Terminal</span>
                <span id="screenMode" class="text-[10px] text-[#ff007f] font-bold">IVU: 11.5%</span>
            </div>
            
            <div class="flex flex-col space-y-0.5 justify-end h-full pt-2">
                <div class="text-[11px] text-slate-500">IVU+PROP: <span id="outIvuTip" class="font-mono">\$0.00</span></div>
                <div class="text-[11px] text-slate-500">TOTAL CTA: <span id="outTotal" class="font-mono">\$0.00</span></div>
                <div class="text-2xl synth-font font-black text-[#00f0ff] neon-text-cyan mt-1">
                    <span class="text-xs text-cyan-500 mr-1">C/U:</span>\$<span id="outPerPerson">0.00</span>
                </div>
            </div>
        </div>

        <!-- TECLADO NUMÉRICO Y CONTROLES -->
        <div class="flex flex-col space-y-3">
            
            <!-- Entrada de Monto Principal -->
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-cyan-400 font-bold mb-1">Monto Subtotal (\$)</label>
                <input type="number" id="subtotal" placeholder="0.00" step="0.01" class="w-full bg-[#090214] border border-[#00f0ff]/50 rounded-xl py-2 px-3 text-lg font-mono text-[#00f0ff] focus:outline-none focus:border-[#00f0ff] text-center" oninput="calculate()">
            </div>

            <!-- Selector de IVU (Botones con Estado Dinámico) -->
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-cyan-400 font-bold mb-1">Tasa de Impuesto (IVU)</label>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <button id="ivu115" onclick="setIVU(11.5)" class="py-2 rounded-xl btn-active synth-font">11.5%</button>
                    <button id="ivu6" onclick="setIVU(6.0)" class="py-2 rounded-xl btn-inactive synth-font">6.0%</button>
                    <button id="ivu0" onclick="setIVU(0.0)" class="py-2 rounded-xl btn-inactive synth-font">0.0%</button>
                </div>
            </div>

            <!-- Parámetros variables (Propina y Personas) -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-cyan-400 font-bold mb-1">Propina (%)</label>
                    <input type="number" id="tip" value="0" min="0" class="w-full bg-[#090214] border border-[#ff007f]/50 rounded-xl py-2 px-3 text-center text-[#ff007f] focus:outline-none focus:border-[#ff007f]" oninput="calculate()">
                </div>
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-cyan-400 font-bold mb-1">Personas (N)</label>
                    <input type="number" id="people" value="0" min="0" class="w-full bg-[#090214] border border-[#ff007f]/50 rounded-xl py-2 px-3 text-center text-[#ff007f] focus:outline-none focus:border-[#ff007f]" oninput="calculate()">
                </div>
            </div>

            <!-- BOTÓN ACCIÓN DE EXPORTAR -->
            <button onclick="copyBill()" class="w-full bg-gradient-to-r from-[#ff007f] to-[#b800c4] text-white py-3 rounded-xl font-bold uppercase tracking-wider text-xs transition-all hover:brightness-125 synth-font shadow-[0_0_12px_rgba(255,0,127,0.4)]">
                Enviar por WhatsApp
            </button>
        </div>
    </div>

    <!-- CONTROLADORES LÓGICOS DE LA CALCULADORA -->
    <script>
        let ivuRate = 11.5;

        function setIVU(perc) {
            ivuRate = perc;
            
            // Apagar todos los botones primero
            ['ivu115', 'ivu6', 'ivu0'].forEach(id => {
                const btn = document.getElementById(id);
                btn.classList.remove('btn-active');
                btn.classList.add('btn-inactive');
            });

            // Encender el botón presionado
            let activeId = 'ivu115';
            if (perc === 6.0) activeId = 'ivu6';
            if (perc === 0.0) activeId = 'ivu0';
            
            const activeBtn = document.getElementById(activeId);
            activeBtn.classList.remove('btn-inactive');
            activeBtn.classList.add('btn-active');

            // Actualizar etiqueta interna en la pantalla digital
            document.getElementById('screenMode').innerText = `IVU: ${perc.toFixed(1)}%`;
            calculate();
        }

        function calculate() {
            // Obtener inputs crudos de la calculadora
            let sub = parseFloat(document.getElementById('subtotal').value) || 0;
            let tipPerc = parseFloat(document.getElementById('tip').value) || 0;
            let ppl = parseInt(document.getElementById('people').value) || 0;

            // Fórmulas matemáticas
            let ivuValue = sub * (ivuRate / 100);
            let tipValue = sub * (tipPerc / 100);
            let totalValue = sub + ivuValue + tipValue;
            
            // Si las personas están en 0 o vacías, la división se evalúa contra 1 para evitar errores de Infinity
            let divisor = ppl > 0 ? ppl : 1; 
            let perPersonValue = totalValue / divisor;

            // Inyectar texto formateado en la pantalla digital de la calculadora
            document.getElementById('outIvuTip').innerText = `$${(ivuValue + tipValue).toFixed(2)}`;
            document.getElementById('outTotal').innerText = `$${totalValue.toFixed(2)}`;
            document.getElementById('outPerPerson').innerText = perPersonValue.toFixed(2);
        }

        function copyBill() {
            let perPerson = document.getElementById('outPerPerson').innerText;
            let total = document.getElementById('outTotal').innerText;
            let ppl = document.getElementById('people').value || 0;
            
            let text = `📟 *PR TERMINAL CALC* 📟\n`;
            text += `Cada persona aporta: *$${perPerson}*\n`;
            text += `Total de Cuenta: ${total} (Entre ${ppl} personas)\n`;
            text += `¡Enviado desde mi terminal Synthwave por ATH Móvil! 🇵🇷`;

            navigator.clipboard.writeText(text).then(() => {
                alert('¡Copiado a la memoria! Listo para pegar en tu chat.');
            });
        }
    </script>
</body>
</html>
